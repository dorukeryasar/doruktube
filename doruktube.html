<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DorukTube</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Fonts & Tailwind Config -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#FF1111', // Bright Red
                        bgdark: '#000000',
                        graydark: '#111111',
                        graylight: '#222222'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FF1111;
        }
        /* Custom Red UI Elements */
        .red-border-box {
            border: 2px solid #FF1111;
            border-radius: 16px;
            overflow: hidden;
            background-color: #111111;
        }
        .red-btn {
            border: 2px solid #FF1111;
            border-radius: 9999px;
            padding: 6px 20px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: transparent;
            color: #FF1111;
        }
        .red-btn:hover {
            background-color: rgba(255, 17, 17, 0.15);
        }
        .red-btn-solid {
            background-color: #FF1111;
            color: #000000;
            border: 2px solid #FF1111;
            border-radius: 9999px;
            padding: 6px 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .red-btn-solid:hover {
            background-color: #cc0000;
            border-color: #cc0000;
        }
        .input-line {
            border: none;
            border-bottom: 2px solid #FF1111;
            background: transparent;
            color: white;
            outline: none;
            width: 100%;
            padding: 8px 4px;
            transition: border-color 0.2s;
        }
        .input-line:focus {
            border-bottom: 2px solid #ff4444;
        }
        .input-line::placeholder {
            color: rgba(255, 17, 17, 0.5);
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }
        
        /* Hide scrollbar for neatness */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #FF1111; border-radius: 10px; }
    </style>
</head>
<body class="antialiased min-h-screen pb-10">

    <!-- Header -->
    <header class="flex justify-between items-center p-3 sticky top-0 bg-black z-40 red-border-box mx-2 mt-2 px-4 md:px-6">
        <div class="flex items-center gap-2 font-black text-xl tracking-tight cursor-pointer" onclick="window.scrollTo(0,0)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-brand">
              <path d="M4.5 4.5a3 3 0 00-3 3v9a3 3 0 003 3h8.25m-1.25-15h8.25a3 3 0 013 3v9a3 3 0 01-3 3H15M8.25 4.5v15m0-15h-4.5m4.5 15h-4.5" />
              <path d="M10.5 9.75L14.25 12l-3.75 2.25v-4.5z" />
            </svg>
            <span>DorukTube</span>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="openUploadModal()" class="red-btn hidden sm:flex gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Yükle
            </button>
            <!-- Mobile Upload Icon -->
            <button onclick="openUploadModal()" class="sm:hidden p-2 text-brand">
                 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            <button id="auth-btn" onclick="openAuthModal()" class="red-btn-solid text-sm">
                Giriş Yap
            </button>
        </div>
    </header>

    <!-- Main Content (Video Feed) -->
    <main class="p-3 max-w-4xl mx-auto mt-4" id="video-feed">
        <!-- Videos will be injected here dynamically -->
    </main>

    <!-- Supabase Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay p-4">
        <div class="red-border-box w-full max-w-sm p-6 space-y-6 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-brand hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h2 class="text-2xl font-black text-center">Supabase Giriş</h2>
            <form id="auth-form" class="space-y-4" onsubmit="handleAuth(event)">
                <div>
                    <input type="email" id="auth-email" placeholder="E-posta adresi" class="input-line" required>
                </div>
                <div>
                    <input type="password" id="auth-password" placeholder="Şifre" class="input-line" required>
                </div>
                <div id="auth-error" class="text-xs text-white bg-red-900/50 p-2 rounded hidden"></div>
                <div class="flex flex-col gap-3 pt-4">
                    <button type="submit" class="red-btn-solid w-full">Giriş Yap / Kayıt Ol</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Video Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay p-4">
        <div class="red-border-box w-full max-w-lg p-6 space-y-6 relative">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-brand hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h2 class="text-2xl font-black flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                Video Yükle
            </h2>
            <form id="upload-form" class="space-y-5" onsubmit="handleVideoUpload(event)">
                
                <div class="border-2 border-dashed border-brand rounded-xl p-8 text-center hover:bg-brand/5 transition-colors cursor-pointer relative">
                    <input type="file" id="video-file" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required onchange="updateFileName()">
                    <div class="space-y-2 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto text-brand">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                        </svg>
                        <p class="font-bold text-white" id="file-name-display">Bir video dosyası seçin veya sürükleyin</p>
                    </div>
                </div>

                <div>
                    <input type="text" id="video-title" placeholder="Video Başlığı" class="input-line text-lg font-bold" required>
                </div>
                
                <div>
                    <textarea id="video-desc" placeholder="Video Açıklaması..." class="input-line h-20 resize-none text-white text-sm"></textarea>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="red-btn-solid">Yükle ve Paylaş</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- Supabase Config Placeholder ---
        const SUPABASE_URL = 'https://wawkbelprkrhfyngcaei.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tquuOepSjSv6sGn9-esPlg_80qCTMo9';
        
        let supabaseClient;
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // --- State ---
        let currentUser = null; // null means not logged in
        let videos = [
            // Dummy initial video to show UI
            {
                id: 'dummy-1',
                title: 'Örnek DorukTube Videosu',
                description: 'Bu video arayüzün nasıl göründüğünü test etmek için buradadır. Yukarıdaki YÜKLE butonuna basarak kendi videonu yükleyebilirsin!',
                uploader: '@doruk_admin',
                videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', // Big Buck Bunny sample
                likes: 42,
                dislikes: 1
            }
        ];

        // --- DOM Elements ---
        const feedContainer = document.getElementById('video-feed');
        const authModal = document.getElementById('auth-modal');
        const uploadModal = document.getElementById('upload-modal');
        const authBtn = document.getElementById('auth-btn');

        // --- Initialization ---
        function init() {
            renderFeed();
            updateAuthUI();
        }

        // --- UI Rendering ---
        function renderFeed() {
            feedContainer.innerHTML = ''; // Clear current feed
            
            if (videos.length === 0) {
                feedContainer.innerHTML = `<div class="text-center text-white opacity-50 py-20 font-bold">Henüz video yok. İlk yükleyen sen ol!</div>`;
                return;
            }

            videos.forEach(video => {
                const cardHTML = `
                    <article class="red-border-box mb-8 shadow-2xl">
                        <!-- Video Player -->
                        <div class="w-full bg-black aspect-video relative">
                            <video 
                                controls 
                                class="w-full h-full object-contain"
                                src="${video.videoUrl}">
                            </video>
                        </div>
                        
                        <!-- Video Info -->
                        <div class="p-4 space-y-3">
                            <h2 class="text-2xl font-black text-white">${video.title}</h2>
                            
                            <!-- Channel & Actions -->
                            <div class="flex flex-wrap items-center justify-between gap-4 py-2 border-b border-graylight">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-graydark border border-brand flex items-center justify-center font-bold text-white uppercase overflow-hidden">
                                        ${video.uploader.charAt(1)}
                                    </div>
                                    <span class="font-bold text-brand">${video.uploader}</span>
                                </div>
                                
                                <div class="flex items-center gap-2">
                                    <button class="red-btn text-sm py-1.5 px-4" onclick="likeVideo('${video.id}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1 inline"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.514" /></svg>
                                        <span id="likes-${video.id}">${video.likes}</span>
                                    </button>
                                    <button class="red-btn text-sm py-1.5 px-4" onclick="dislikeVideo('${video.id}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1 inline"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.714.211-1.412.608-2.006L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.514" /></svg>
                                        <span id="dislikes-${video.id}">${video.dislikes}</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="text-sm text-gray-300 font-medium leading-relaxed bg-graylight/30 p-3 rounded-xl">
                                ${video.description || 'Açıklama yok.'}
                            </div>
                        </div>
                    </article>
                `;
                feedContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // --- Interaction Logic ---
        function likeVideo(id) {
            const vid = videos.find(v => v.id === id);
            if(vid) {
                vid.likes++;
                document.getElementById(`likes-${id}`).innerText = vid.likes;
            }
        }

        function dislikeVideo(id) {
            const vid = videos.find(v => v.id === id);
            if(vid) {
                vid.dislikes++;
                document.getElementById(`dislikes-${id}`).innerText = vid.dislikes;
            }
        }

        // --- Upload Video Logic ---
        function openUploadModal() {
            if (!currentUser) {
                // Require login to upload (Optional, but makes sense)
                openAuthModal();
                showAuthError("Video yüklemek için lütfen giriş yapın.");
                return;
            }
            uploadModal.classList.remove('hidden');
        }

        function closeUploadModal() {
            uploadModal.classList.add('hidden');
            document.getElementById('upload-form').reset();
            document.getElementById('file-name-display').innerText = 'Bir video dosyası seçin veya sürükleyin';
        }

        function updateFileName() {
            const fileInput = document.getElementById('video-file');
            const display = document.getElementById('file-name-display');
            if (fileInput.files.length > 0) {
                display.innerText = fileInput.files[0].name;
                display.classList.add('text-brand');
            } else {
                display.innerText = 'Bir video dosyası seçin veya sürükleyin';
                display.classList.remove('text-brand');
            }
        }

        function handleVideoUpload(event) {
            event.preventDefault();
            
            const fileInput = document.getElementById('video-file');
            const title = document.getElementById('video-title').value.trim();
            const desc = document.getElementById('video-desc').value.trim();

            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            
            // Create a local URL for the selected video file
            const videoObjectURL = URL.createObjectURL(file);

            // Create new video object
            const newVideo = {
                id: 'vid-' + Date.now(),
                title: title,
                description: desc,
                uploader: currentUser || '@kullanıcı',
                videoUrl: videoObjectURL,
                likes: 0,
                dislikes: 0
            };

            // Add to the top of the feed array
            videos.unshift(newVideo);
            
            // Re-render feed
            renderFeed();
            
            // Close and clean up modal
            closeUploadModal();
        }

        // --- Auth Logic (Mock) ---
        function openAuthModal() {
            if (currentUser) {
                // If already logged in, clicking the button logs out
                currentUser = null;
                updateAuthUI();
            } else {
                authModal.classList.remove('hidden');
                document.getElementById('auth-error').classList.add('hidden');
            }
        }

        function closeAuthModal() {
            authModal.classList.add('hidden');
            document.getElementById('auth-form').reset();
        }

        function showAuthError(msg) {
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = msg;
            errDiv.classList.remove('hidden');
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            // Basic mock validation
            if(password.length < 6) {
                showAuthError("Şifre en az 6 karakter olmalıdır.");
                return;
            }

            // Simulate successful login/register
            const username = email.split('@')[0];
            currentUser = '@' + username;
            
            closeAuthModal();
            updateAuthUI();
        }

        function updateAuthUI() {
            if (currentUser) {
                authBtn.innerText = currentUser;
                authBtn.classList.replace('red-btn-solid', 'red-btn');
                authBtn.title = "Çıkış Yap";
            } else {
                authBtn.innerText = 'Giriş Yap';
                authBtn.classList.replace('red-btn', 'red-btn-solid');
                authBtn.title = "Giriş Yap";
            }
        }

        // Run init on load
        window.onload = init;

    </script>
</body>
</html>
