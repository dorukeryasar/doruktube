<title>DorukTube</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0e12; --surface:#17171d; --surface2:#1f1f27; --line:rgba(255,255,255,.08);
  --tx:#f4f4f6; --mut:#9a9aa8; --red:#ff2d3d; --red2:#ff6a3d;
  --grad:linear-gradient(135deg,#ff2d3d,#ff6a3d);
  --r:18px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Lexend',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,45,61,.14),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,106,61,.08),transparent 60%);
  background-attachment:fixed}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:inherit}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(14,14,18,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 16px rgba(255,45,61,.35)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{flex:1;max-width:520px;margin:0 auto;position:relative}
.sbox input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px 11px 42px;outline:none;font-size:14px;transition:.2s}
.sbox input:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13.5px;transition:.2s;white-space:nowrap}
.btn:hover{background:#2a2a34;transform:translateY(-1px)}
.btn.pri{background:var(--grad);border:0;font-weight:600;box-shadow:0 6px 20px rgba(255,45,61,.3)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 8px 26px rgba(255,45,61,.45)}
.btn.on{background:var(--surface2);color:var(--mut)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:17px;height:17px}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 2px var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.lnk{cursor:pointer}
.lnk:hover{text-decoration:underline}

/* Layout */
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px calc(var(--nav) + 30px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--mut);transition:.2s;white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.chip.cat.on{background:var(--grad);color:#fff;border:0}
.chip:not(.on):hover{color:var(--tx);background:var(--surface2)}
h2.sec{font-size:18px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
h2.sec i{width:4px;height:18px;border-radius:4px;background:var(--grad);display:inline-block}

/* Video grid */
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,1fr)}}
.vcard{cursor:pointer;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--surface2) center/cover no-repeat;transition:.25s;box-shadow:0 0 0 1px var(--line)}
.vcard:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,45,61,.5)}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.vcard:hover .play,.thumb.noimg .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(255,45,61,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,45,61,.5)}
.play svg{width:22px;height:22px;margin-left:3px}
.ctag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:500}
.vinfo{display:flex;gap:11px;margin-top:11px}
.vtxt{min-width:0}
.vt{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{font-size:12.5px;color:var(--mut);margin-top:3px}

/* Shorts */
.shorts{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;margin-bottom:22px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shorts::-webkit-scrollbar{display:none}
.scard{flex:none;width:158px;scroll-snap-align:start;cursor:pointer;animation:up .4s both}
.scard .thumb{aspect-ratio:9/16;border-radius:16px}
@media(min-width:620px){.scard{width:190px}}

/* Skeleton */
.sk .thumb{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk .l{height:12px;border-radius:6px;margin-top:10px;background:var(--surface)}
@keyframes sh{to{background-position:-200% 0}}

/* Video page */
.watch{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){.watch{grid-template-columns:minmax(0,1fr) 380px}}
video.player{width:100%;max-height:72vh;background:#000;border-radius:var(--r);display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.wt{font-size:20px;font-weight:600;margin:16px 0 6px;line-height:1.3}
.wmeta{color:var(--mut);font-size:13px}
.wbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.who small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lk{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lk button{background:transparent;padding:9px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:.2s}
.lk button+button{border-left:1px solid var(--line)}
.lk button:hover{background:#2a2a34}
.lk button.on{background:var(--grad);font-weight:600}
.lk svg{width:17px;height:17px}
.desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.desc .tp{display:inline-block;background:rgba(255,45,61,.15);color:#ff7a85;border-radius:999px;padding:3px 11px;font-size:12px;margin:0 6px 8px 0;font-weight:500}
.comm h3{font-size:16px;margin:22px 0 12px}
.cin{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.cin input{flex:1;background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;outline:none;font-size:14px;transition:.2s}
.cin input:focus{border-color:var(--red)}
.cm{display:flex;gap:12px;padding:10px 0;animation:up .3s both}
.cm .avatar{width:34px;height:34px;font-size:14px}
.cm .b{font-size:13.5px;line-height:1.5;flex:1;min-width:0;word-break:break-word}
.cm .b small{color:var(--mut);margin-left:6px}
.cm .b b{font-weight:600}
.cm .x{color:#ff7a85;font-size:12px;background:none;padding:4px 8px;border-radius:8px}
.cm .x:hover{background:rgba(255,45,61,.12)}
.side h3{font-size:16px;margin:0 0 14px}
.rel{display:flex;gap:12px;margin-bottom:14px;cursor:pointer}
.rel .thumb{width:160px;flex:none;border-radius:12px}
.rel .vt{font-size:13.5px}

/* Kanal */
.banner{height:150px;border-radius:var(--r);margin-bottom:-44px}
.chead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:0 18px;margin-bottom:16px}
.chead .avatar{width:92px;height:92px;font-size:38px;border:4px solid var(--bg)}
.chead .ci{flex:1;min-width:180px;padding-bottom:4px}
.chead h1{margin:0;font-size:22px}
.chead .st{color:var(--mut);font-size:13px;margin-top:4px}
.bio{color:#cfcfd8;font-size:13.5px;line-height:1.6;padding:0 18px;margin-bottom:18px;white-space:pre-wrap}
.chcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.2s;animation:up .4s both}
.chcard:hover{background:var(--surface2);transform:translateY(-2px)}
.chcard .avatar{width:56px;height:56px;font-size:22px}
.chgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.chgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.chgrid{grid-template-columns:repeat(3,1fr)}}

/* Bildirim */
.nlist{max-width:680px;margin:0 auto}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.2s;animation:up .3s both}
.nitem:hover{background:var(--surface2)}
.nitem.unread{border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(255,45,61,.08),var(--surface))}
.nitem .ni{font-size:22px;line-height:1}
.nitem .nt{font-size:13.5px;line-height:1.5}
.nitem small{color:var(--mut);font-size:12px}

/* Forms */
.panel{max-width:460px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.panel.wide{max-width:600px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel p.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=password],.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:14px;transition:.2s;resize:vertical}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.drop{display:block;border:2px dashed rgba(255,255,255,.16);border-radius:16px;padding:28px 14px;text-align:center;cursor:pointer;transition:.2s;font-size:13.5px;color:var(--mut)}
.drop:hover,.drop.over{border-color:var(--red);background:rgba(255,45,61,.06);color:var(--tx)}
.drop svg{width:34px;height:34px;color:var(--red);margin-bottom:6px}
.drop input{display:none}
.drop b{display:block;color:var(--tx);word-break:break-all}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1;padding:13px}
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:6px 0 14px;cursor:pointer}
.sw input{accent-color:var(--red);width:18px;height:18px}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:8px 0;display:none}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.hint{font-size:12px;color:var(--mut)}
.msg{font-size:13px;color:#ff8a93;min-height:20px;margin-bottom:8px}
.msg.ok{color:#7dffa0}
.empty{text-align:center;color:var(--mut);padding:60px 10px;font-size:14px}
.empty .big{font-size:42px;margin-bottom:8px}

/* Robot doğrulaması */
.cap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.cap .shield{font-size:24px}
.cap .q{flex:1;font-size:13.5px}
.cap .q b{font-size:16px;letter-spacing:1px}
.cap input{width:72px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-size:15px;outline:none}
.cap input:focus{border-color:rgba(255,45,61,.6)}
.cap .re{background:none;font-size:17px;color:var(--mut);padding:4px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* Bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(14,14,18,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
nav.bn button{position:relative;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:6px 8px;transition:.2s;min-width:56px}
nav.bn button.on{color:var(--tx)}
nav.bn svg{width:22px;height:22px}
nav.bn .badge{top:0;right:8px}
nav.bn .plus{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 20px rgba(255,45,61,.45);margin-top:-14px}
nav.bn .plus svg{width:24px;height:24px}
@media(min-width:760px){nav.bn{display:none}.wrap{padding-bottom:40px}}
@media(max-width:759px){.hdesk{display:none}.sbox{margin:0}.logo span{display:none}}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
@media(min-width:760px){#toasts{bottom:30px}}
.toast{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .25s both;pointer-events:auto}
.toast.err{border-color:rgba(255,45,61,.6)}
.toast.n{border-color:rgba(255,106,61,.6);cursor:pointer}

/* Canlı yayın */
.lvwrap{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lvwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000;max-height:none}
.lvbadge{position:absolute;left:12px;top:12px;z-index:2;background:#e5172a;border-radius:8px;padding:4px 10px 4px 9px;font-size:11.5px;font-weight:700;letter-spacing:.6px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(229,23,42,.5)}
.lvbadge::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.thumb .lvbadge{left:10px;top:10px}
@keyframes pulse{50%{opacity:.25}}
.lvview{position:absolute;right:12px;top:12px;z-index:2;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:8px;padding:4px 10px;font-size:12px}
.lvst{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:14px;text-align:center;padding:24px;line-height:1.5}
.lvmute{position:absolute;right:12px;bottom:12px;z-index:2}
.srcs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;height:min(70vh,560px)}
@media(max-width:999px){.chat{height:50vh}}
.clog{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45;word-break:break-word}
.clog .m b{color:#ffb0b6;font-weight:600;margin-right:6px}
.clog .m.h b{color:#ff6a3d}
.clog .m.h b::after{content:' • yayıncı';font-weight:400;color:var(--mut);font-size:11px}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none;font-size:13.5px}
.cform input:focus{border-color:rgba(255,45,61,.6)}
.chip.livechip{color:#ff7a85}

/* GIF */
.cgif{display:block;max-width:240px;max-height:220px;border-radius:12px;margin-top:6px;background:var(--surface2)}
.clog .cgif{max-width:200px;max-height:160px}
img.player{width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:var(--r);display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.gifbtn{cursor:pointer;padding:9px 12px;font-weight:700;font-size:12px;letter-spacing:.5px}
.gifbadge{position:absolute;right:10px;top:10px;z-index:2;background:var(--grad);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.6px}

/* Yorum ağacı */
.cthread{border-bottom:1px solid var(--line);padding:4px 0}
.cm.rep{margin-left:46px;padding-top:4px}
.cm .pin{font-size:11.5px;color:#ffb0b6;margin-bottom:3px;font-weight:500}
.cact{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cact button{background:none;color:var(--mut);font-size:12px;padding:4px 9px;border-radius:999px;transition:.2s}
.cact button:hover{background:var(--surface2);color:var(--tx)}
.cact button.del:hover{background:rgba(255,45,61,.14);color:#ff7a85}
.ced{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.ced input{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;outline:none;font-size:13.5px}
.ced .btn{padding:7px 13px;font-size:12.5px}
.crep{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mut)}
.crep b{color:var(--tx)}
.crep button,.cpin button{background:none;color:var(--mut);font-size:14px;padding:2px 6px}
.chat .crep{border-radius:0;margin:0;border-top:1px solid var(--line)}
.cpin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;background:rgba(255,45,61,.1);border-bottom:1px solid var(--line);font-size:12.5px}
.cpin b{color:#ffb0b6}
.clog .m{border-radius:10px;padding:4px 6px;margin:0 -6px}
.clog .m.sel{background:var(--surface2)}
.clog .m .cact{display:none}
.clog .m.sel .cact{display:flex}

.clog .rq{font-size:11.5px;color:var(--mut);border-left:3px solid var(--red);padding-left:8px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clog .ed{color:var(--mut)}

/* GIF seçici */
.gifm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
@media(min-width:760px){.gifm{align-items:center}}
.gifbox{width:100%;max-width:520px;height:72vh;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s both}
@media(min-width:760px){.gifbox{border-radius:22px;height:560px}}
.gifh{display:flex;gap:8px;padding:12px}
.gifh input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none;font-size:14px}
.gifh input:focus{border-color:rgba(255,45,61,.6)}
.gifg{flex:1;overflow-y:auto;columns:2;column-gap:8px;padding:0 12px 12px}
.gifg img{width:100%;display:block;border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface2);break-inside:avoid;transition:.15s}
.gifg img:hover{transform:scale(1.03)}
.gifp{text-align:center;font-size:11px;color:var(--mut);padding:8px;border-top:1px solid var(--line)}

/* Hesap ayarları */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 20px;max-width:560px}
.set h3{margin:0 0 14px;font-size:16px}
.set h4{margin:18px 0 10px;font-size:14px;color:var(--mut);font-weight:500}
.srow{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.avatar.big{width:72px;height:72px;font-size:30px}
img.avatar{object-fit:cover}

/* @etiket */
.mn{color:#ff8a93;font-weight:500}
.mn.lnk:hover{text-decoration:underline}
.clog .m.me{background:rgba(255,45,61,.12);box-shadow:inset 3px 0 0 var(--red)}
.mnbox{position:fixed;z-index:300;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:up .15s both}
.mnbox div{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:13.5px}
.mnbox div.on,.mnbox div:hover{background:var(--surface2)}
.mnbox .avatar{width:28px;height:28px;font-size:12px}

/* ---------- Yardımcılar ---------- */
function toast(t, kind, onclick){
  const d = document.createElement('div'); d.className = 'toast' + (kind==='err'?' err':kind==='n'?' n':''); d.textContent = t;
  if(onclick) d.onclick = () => { onclick(); d.remove(); };
  $('#toasts').appendChild(d); setTimeout(()=>d.remove(), 4200);
}
function ago(ts){
  const s = Math.max(1, (Date.now() - new Date(ts)) / 1000);
  const u = [[31536000,'yıl'],[2592000,'ay'],[604800,'hafta'],[86400,'gün'],[3600,'saat'],[60,'dk']];
  for(const [n,l] of u) if(s >= n) return Math.floor(s/n) + ' ' + l + ' önce';
  return 'az önce';
}
function hue(name){ let h = 0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0)) % 360; return h; }
function av(name, cls=''){
  if(typeof avatarMap !== 'undefined' && avatarMap[name]) return `<img class="avatar ${cls}" src="${esc(avatarMap[name])}" alt="" loading="lazy">`;
  const h = hue(name);
  return `<div class="avatar ${cls}" style="background:linear-gradient(135deg,hsl(${h} 80% 55%),hsl(${(h+40)%360} 80% 45%))">${esc(String(name)[0]?.toUpperCase()||'?')}</div>`;
}
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+' Mn' : n >= 1e3 ? (n/1e3).toFixed(1)+' B' : String(n);
const q1 = s => String(s).replace(/'/g, "\\'");

/* ---------- Cihaz Ban Kontrolü ---------- */
async function checkBan(username) {
  // Cihaz daha önce damgalandıysa direkt banlı say
  if(localStorage.getItem('dt_banned') === 'true') return true; 
  if(username) {
    const {data} = await sb.from('bans').select('username').eq('username', username).maybeSingle();
    if(data) {
      localStorage.setItem('dt_banned', 'true'); // Cihazı kalıcı olarak damgala
      return true;
    }
  }
  return false;
}

/* ---------- Oturum ---------- */
async function setUser(u){
  const changed = (u?.id) !== (me?.id);
  me = u || null; myName = u?.user_metadata?.username || null;
  
  // EĞER CİHAZ VEYA HESAP BANLIYSA SİTEYİ KİLİTLE
  if(await checkBan(myName)) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:red;font-size:24px;text-align:center;padding:20px;font-family:sans-serif;font-weight:bold;">Topluluk kurallarına aykırı hareketler yaptığınız için atıldınız</div>';
    return;
  }

  if(changed){ stopRealtime(); mySubs = new Set(); notifs = []; if(me) loadUserData(); }
  header();
}

async function loadUserData(){
  const uid = me.id;
  const [s, n] = await Promise.all([
    sb.from('subscriptions').select('channel_id').eq('subscriber_id', uid),
    sb.from('notifications').select('*').eq('user_id', uid).order('created_at',{ascending:false}).limit(60)
  ]);
  if(!me || me.id !== uid) return;
  mySubs = new Set((s.data||[]).map(x => x.channel_id));
  notifs = n.data || [];
  header(); startRealtime();
  if(route.page==='home') list();
  if(route.page==='notifications') renderNotifs();
}

/* ---------- Yönlendirme (hash) ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if(h[0]==='video' && h[1]) return {page:'video', id:+h[1]};
  if(h[0]==='c' && h[1]) return {page:'channel', id:decodeURIComponent(h[1])};
  if(h[0]==='live' && h[1]) return {page:'watchlive', id:+h[1]};
  if(['auth','upload','channels','notifications','live','golive','games'].includes(h[0])) return {page:h[0]};
  return {page:'home'};
}
function go(page, id){
  const t = page==='home' ? '' : page==='video' ? 'video/'+id : page==='watchlive' ? 'live/'+id : page==='channel' ? 'c/'+encodeURIComponent(id) : page;
  const target = '#/' + t;
  if(location.hash === target || (page==='home' && (location.hash==='' || location.hash==='#/' ))){ route = {page,id}; header(); render(); window.scrollTo(0,0); }
  else location.hash = target;
}
window.addEventListener('hashchange', () => { route = parseHash(); header(); render(); window.scrollTo(0,0); });
async function render(){
  stopLiveCtx();
  const app = $('#app');
  const r = {live:livePage, watchlive:watchLive, golive:goLivePage, home, video:videoPage, channel:channelPage, channels:channelsPage, notifications:notifPage, auth:authPage, upload:uploadPage, games:gamesPage}[route.page];
  if(r) return r(app, route.id);
}

async function postComment(id, text){

/* ---------- GIF seçici (Giphy) ---------- */
function gifUrl(t){
  t = String(t||'').trim();
  if(!/^https:\/\/\S+\.gif(\?\S*)?$/i.test(t)) return null;
  try{
    const h = new URL(t).hostname;
    if(h === new URL(SUPABASE_URL).hostname || /^(media\d*|i)\.giphy\.com$/.test(h) || /^(media|c)\.tenor\.com$/.test(h)) return t;
  }catch(e){}
  return null;
}
function gifImg(url){ const i = document.createElement('img'); i.className = 'cgif'; i.src = url; i.loading = 'lazy'; i.alt = 'GIF'; return i; }
let gifCb = null, gifTimer = null;
function openGif(cb){
  if(!me){ toast('GIF göndermek için giriş yapmalısın.', 'err'); return go('auth'); }
  gifCb = cb;
  let m = $('#gifm'); if(!m){ m = document.createElement('div'); m.id = 'gifm'; m.className = 'gifm'; document.body.appendChild(m); }
  m.innerHTML = `<div class="gifbox"><div class="gifh"><input id="gifq" placeholder="GIF ara..." autocomplete="off"><button class="btn" onclick="closeGif()">✕</button></div>
    <div class="gifg" id="gifg"></div><div class="gifp">Powered by GIPHY</div></div>`;
  m.style.display = 'flex'; m.onclick = e => { if(e.target === m) closeGif(); };
  $('#gifq').addEventListener('input', e => { clearTimeout(gifTimer); gifTimer = setTimeout(() => gifSearch(e.target.value), 350); });
  gifSearch(''); $('#gifq').focus();
}
function closeGif(){ const m = $('#gifm'); if(m) m.style.display = 'none'; gifCb = null; }
async function gifSearch(q){
  const g = $('#gifg'); if(!g) return; q = q.trim();
  if(!GIPHY_API_KEY){ g.innerHTML = '<div class="hint" style="padding:18px;line-height:1.6">GIF arama için Giphy API anahtarı gerekli.<br>developers.giphy.com\'dan ücretsiz anahtar alıp <b>index.html</b> içindeki <b>GIPHY_API_KEY</b> satırına yaz.</div>'; return; }
  g.innerHTML = '<div class="hint" style="padding:18px">Yükleniyor...</div>';
  try{
    const u = `https://api.giphy.com/v1/gifs/${q ? 'search' : 'trending'}?api_key=${encodeURIComponent(GIPHY_API_KEY)}&limit=24&rating=pg&lang=tr${q ? '&q=' + encodeURIComponent(q) : ''}`;
    const r = await fetch(u); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    window._gl = (j.data || []).map(x => ({s:x.images.fixed_height_small.url, u:x.images.fixed_height.url}));
    g.innerHTML = window._gl.length ? window._gl.map((x,i) => `<img src="${esc(x.s)}" loading="lazy" alt="GIF" onclick="pickGif(${i})">`).join('') : '<div class="hint" style="padding:18px">Sonuç bulunamadı.</div>';
  }catch(e){ g.innerHTML = '<div class="hint" style="padding:18px">GIF\'ler yüklenemedi. Anahtarı kontrol et.</div>'; }
}
function pickGif(i){
  const x = window._gl[i], cb = gifCb; if(!x || !cb) return;
  if(!gifUrl(x.u)) return toast('Bu GIF kullanılamıyor.', 'err');
  closeGif(); cb(x.u);
}

async function squareJpeg(file, size){
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height), c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s)/2, (bmp.height - s)/2, s, s, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Resim işlenemedi')), 'image/jpeg', 0.86));
}
async function pickAvatar(input){
  const f = input.files[0]; input.value = ''; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('Bir resim dosyası seç.', 'err');
  if(f.size > 8*1024*1024) return toast('Resim 8 MB\'tan küçük olmalı.', 'err');
  toast('Yükleniyor...');
  try{
    const blob = await squareJpeg(f, 256);
    const path = `${me.id}/avatar_${Date.now()}.jpg`;
    const {error:e1} = await sb.storage.from('videos').upload(path, blob, {contentType:'image/jpeg'}); if(e1) throw e1;
    const url = sb.storage.from('videos').getPublicUrl(path).data.publicUrl;

  }catch(e){ toast('Hata: ' + (e.message||e) + ' (update-v6.sql çalıştırıldı mı?)', 'err'); }

const MN_RE = /@([A-Za-z0-9_]{3,20})/g;
function mention(text){
  return esc(text).replace(MN_RE, (m, n) => userSet.has(n) ? `<span class="mn lnk" onclick="go('channel','${n}')">@${n}</span>` : m);
}
function mentionsMe(t){ return !!(me && myName && new RegExp('(^|[^A-Za-z0-9_])@' + myName + '(?![A-Za-z0-9_])').test(String(t))); }
function appendMentions(d, text){   // sohbet için: bağlantı değil, sadece vurgu (yayıncı yanlışlıkla sayfadan ayrılmasın)
  let last = 0;
  text.replace(MN_RE, (m, n, off) => {
    if(!userSet.has(n)) return m;
    if(off > last) d.appendChild(document.createTextNode(text.slice(last, off)));
    const s = document.createElement('span'); s.className = 'mn'; s.textContent = m; d.appendChild(s);
    last = off + m.length; return m;
  });
  if(last < text.length) d.appendChild(document.createTextNode(text.slice(last)));
}
function attachMention(inp){
  if(!inp || inp._mn) return; inp._mn = true;
  let box = null, items = [], idx = 0, start = -1;
  const close = () => { if(box){ box.remove(); box = null; } items = []; };
  const pick = n => {
    const v = inp.value, pos = inp.selectionStart;
    inp.value = v.slice(0, start) + '@' + n + ' ' + v.slice(pos);
    const c = start + n.length + 2; inp.setSelectionRange(c, c); close(); inp.focus();
  };
  const render = () => {
    if(!box){ box = document.createElement('div'); box.className = 'mnbox'; document.body.appendChild(box); }
    box.innerHTML = items.map((n,i) => `<div class="${i===idx?'on':''}" data-n="${n}">${av(n)}<span>@${n}</span></div>`).join('');
    const r = inp.getBoundingClientRect(), h = items.length * 42 + 8;
    const below = window.innerHeight - r.bottom > h + 10;
    box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 248)) + 'px';
    box.style.top = (below ? r.bottom + 6 : r.top - h - 6) + 'px';
    box.querySelectorAll('[data-n]').forEach(el => { el.onmousedown = ev => { ev.preventDefault(); pick(el.dataset.n); }; });
  };
  const update = () => {
    const pos = inp.selectionStart, m = /(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{0,20})$/.exec(inp.value.slice(0, pos));
    if(!m) return close();
    start = pos - m[2].length - 1; const q = m[2].toLowerCase();
    items = userList.filter(n => n !== myName && n.toLowerCase().startsWith(q)).slice(0, 6);
    if(!items.length) return close(); idx = 0; render();
  };
  inp.addEventListener('input', update);
  inp.addEventListener('blur', () => setTimeout(close, 150));
  inp.addEventListener('keydown', e => {
    if(!box) return;
    if(e.key==='ArrowDown'){ idx = (idx + 1) % items.length; render(); }
    else if(e.key==='ArrowUp'){ idx = (idx - 1 + items.length) % items.length; render(); }
    else if(e.key==='Enter' || e.key==='Tab'){ pick(items[idx]); }
    else if(e.key==='Escape'){ close(); }
    else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);
}

async function loadPeople(kind){
