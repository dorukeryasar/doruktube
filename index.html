<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DorukTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0e12; --surface:#17171d; --surface2:#1f1f27; --line:rgba(255,255,255,.08);
  --tx:#f4f4f6; --mut:#9a9aa8; --red:#ff2d3d; --red2:#ff6a3d;
  --grad:linear-gradient(135deg,#ff2d3d,#ff6a3d);
  --r:18px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Lexend',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,45,61,.14),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,106,61,.08),transparent 60%);
  background-attachment:fixed}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:inherit}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(14,14,18,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{flex:1;max-width:520px;margin:0 auto;position:relative}
.sbox input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px 11px 42px;outline:none;font-size:14px;transition:.2s}
.sbox input:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13.5px;transition:.2s;white-space:nowrap}
.btn:hover{background:#2a2a34;transform:translateY(-1px)}
.btn.pri{background:var(--grad);border:0;font-weight:600;box-shadow:0 6px 20px rgba(255,45,61,.3)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 8px 26px rgba(255,45,61,.45)}
.btn.on{background:var(--surface2);color:var(--mut)}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.ibtn:hover{background:var(--surface2)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 2px var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.lnk{cursor:pointer}
.lnk:hover{text-decoration:underline}

/* Layout */
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px calc(var(--nav) + 30px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--mut);transition:.2s;white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.chip.cat.on{background:var(--grad);color:#fff;border:0}
h2.sec{font-size:18px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
h2.sec i{width:4px;height:18px;border-radius:4px;background:var(--grad);display:inline-block}

/* Video grid */
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,1fr)}}
.vcard{cursor:pointer;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--surface2) center/cover no-repeat;transition:.25s;box-shadow:0 0 0 1px var(--line)}
.vcard:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,45,61,.5)}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.vcard:hover .play,.thumb.noimg .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(255,45,61,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,45,61,.5)}
.vinfo{display:flex;gap:11px;margin-top:11px}
.vtxt{min-width:0}
.vt{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{font-size:12.5px;color:var(--mut);margin-top:3px}

/* Shorts */
.shorts{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;margin-bottom:22px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shorts::-webkit-scrollbar{display:none}
.scard{flex:none;width:158px;scroll-snap-align:start;cursor:pointer;animation:up .4s both}
.scard .thumb{aspect-ratio:9/16;border-radius:16px}
@media(min-width:620px){.scard{width:190px}}

/* Skeleton */
.sk .thumb{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk .l{height:12px;border-radius:6px;margin-top:10px;background:var(--surface)}
@keyframes sh{to{background-position:-200% 0}}

/* Video page */
.watch{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){.watch{grid-template-columns:minmax(0,1fr) 380px}}
video.player{width:100%;max-height:72vh;background:#000;border-radius:var(--r);display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.wt{font-size:20px;font-weight:600;margin:16px 0 6px;line-height:1.3}
.wmeta{color:var(--mut);font-size:13px}
.wbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.who small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lk{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lk button{background:transparent;padding:9px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:.2s}
.lk button:hover{background:#2a2a34}
.lk button.on{background:var(--grad);font-weight:600}
.desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.cin{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.cin input{flex:1;background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;outline:none;font-size:14px;transition:.2s}
.cin input:focus{border-color:var(--red)}
.cm{display:flex;gap:12px;padding:10px 0;animation:up .3s both}
.cm .b{font-size:13.5px;line-height:1.5;flex:1;min-width:0;word-break:break-word}
.cm .b small{color:var(--mut);margin-left:6px}
.cm .b b{font-weight:600}
.rel{display:flex;gap:12px;margin-bottom:14px;cursor:pointer}
.rel .thumb{width:160px;flex:none;border-radius:12px}

/* Kanal */
.banner{height:150px;border-radius:var(--r);margin-bottom:-44px}
.chead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:0 18px;margin-bottom:16px}
.chead .avatar{width:92px;height:92px;font-size:38px;border:4px solid var(--bg)}
.chead .ci{flex:1;min-width:180px;padding-bottom:4px}
.chead h1{margin:0;font-size:22px}
.chead .st{color:var(--mut);font-size:13px;margin-top:4px}
.chcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.2s;animation:up .4s both}
.chcard:hover{background:var(--surface2);transform:translateY(-2px)}
.chgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.chgrid{grid-template-columns:repeat(2,1fr)}}

/* Bildirim */
.nlist{max-width:680px;margin:0 auto}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.2s;animation:up .3s both}
.nitem:hover{background:var(--surface2)}
.nitem.unread{border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(255,45,61,.08),var(--surface))}
.nitem .nt{font-size:13.5px;line-height:1.5}
.nitem small{color:var(--mut);font-size:12px}

/* Forms & Panel */
.panel{max-width:460px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.panel.wide{max-width:600px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel p.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=password],.field input[type=email],.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:14px;transition:.2s}
.field input:focus,.field textarea:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.hint{font-size:12px;color:var(--mut)}
.msg{font-size:13px;color:#ff8a93;min-height:20px;margin-bottom:8px}
.msg.ok{color:#7dffa0}
.empty{text-align:center;color:var(--mut);padding:60px 10px;font-size:14px}
.empty .big{font-size:42px;margin-bottom:8px}

/* Bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(14,14,18,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
nav.bn button{position:relative;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:6px 8px;transition:.2s;min-width:56px}
nav.bn button.on{color:var(--tx)}
nav.bn svg{width:22px;height:22px}
nav.bn .badge{top:0;right:8px}
nav.bn .plus{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 20px rgba(255,45,61,.45);margin-top:-14px}
nav.bn .plus svg{width:24px;height:24px}
@media(min-width:760px){nav.bn{display:none}.wrap{padding-bottom:40px}}
@media(max-width:759px){.hdesk{display:none}.sbox{margin:0}.logo span{display:none}}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
@media(min-width:760px){#toasts{bottom:30px}}
.toast{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .25s both;pointer-events:auto}
.toast.err{border-color:rgba(255,45,61,.6)}
</style>
</head>
<body>
<header>
  <div class="hin">
    <div class="logo" onclick="go('home')"><span>Doruk<b>Tube</b></span></div>
    <div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Video, kanal veya kategori ara" autocomplete="off">
    </div>
    <div class="hr" id="hr"></div>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<nav class="bn" id="bn"></nav>
<div id="toasts"></div>

<script>
/* ---------- Ayarlar ---------- */
const SUPABASE_URL = "https://wawkbelprkrhfyngcaei.supabase.co";
const SUPABASE_KEY = "sb_publishable_tquuOepSjSv6sGn9-esPlg_80qCTMo9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, myName = null, isModerator = false;
let route = {page:'home'};
let allVideos = [], cats = [];
let typeF = 'all', catF = null, query = '';
let mySubs = new Set(), notifs = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unread = () => notifs.filter(n => !n.is_read).length;
const catOf = id => cats.find(c => c.id === id);

const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5 6.5-5s5.7 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.5 5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 0 0 4 0"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l14-8z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'
};

function toast(t, kind){
  const d = document.createElement('div'); d.className = 'toast' + (kind==='err'?' err':''); d.textContent = t;
  $('#toasts').appendChild(d); setTimeout(()=>d.remove(), 3500);
}
function ago(ts){ return 'az önce'; } // Basitleştirildi
function av(name){ return `<div class="avatar" style="background:var(--grad)">${esc(String(name)[0]?.toUpperCase()||'?')}</div>`; }

/* ---------- CİHAZ BAN SİSTEMİ ---------- */
function getDeviceFP() {
  let sid = localStorage.getItem('dt_device_id');
  if (!sid) { sid = Math.random().toString(36).substring(2) + Date.now().toString(36); localStorage.setItem('dt_device_id', sid); }
  const c = document.createElement('canvas'); const ctx = c.getContext('2d'); ctx.fillText('DorukTube', 2, 2);
  return btoa(navigator.userAgent.slice(0, 20) + screen.width + c.toDataURL().slice(-20) + sid).replace(/=/g, '');
}

async function checkDeviceBan() {
  const fp = getDeviceFP();
  try {
    let { data } = await sb.from('banned_devices').select('*').eq('device_fp', fp).maybeSingle();
    if (!data && myName) {
       const { data: ud } = await sb.from('banned_devices').select('*').eq('banned_username', myName).maybeSingle();
       if (ud) data = ud;
    }
    if (data) {
      document.body.innerHTML = `
        <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;">
          <div style="background:#17171d; border:1px solid #ff2d3d; border-radius:20px; padding:36px 24px; max-width:480px;">
            <div style="font-size:52px; margin-bottom:16px;">🚫</div>
            <h2 style="color:#ff2d3d; margin:0 0 14px;">Erişim Engellendi</h2>
            <p style="font-size:15px; color:#f4f4f6;">${data.reason || 'Kurallara aykırı hareket ettiniz.'}</p>
          </div>
        </div>`;
      return true;
    }
  } catch (e) {}
  return false;
}

/* ---------- UYGULAMA MANTIĞI VE YÖNLENDİRME ---------- */
function setUser(u){
  me = u || null; myName = u?.user_metadata?.username || null;
  if(me) { checkModStatus(); loadUserData(); } else { isModerator = false; }
  header();
}
async function checkModStatus(){
  if(myName === 'doruktube') isModerator = true;
  else { const {data} = await sb.from('moderators').select('id').eq('username', myName).maybeSingle(); if(data) isModerator = true; }
  header();
}
async function loadUserData(){
  const [s, n] = await Promise.all([
    sb.from('subscriptions').select('channel_id').eq('subscriber_id', me.id),
    sb.from('notifications').select('*').eq('user_id', me.id).order('created_at',{ascending:false})
  ]);
  mySubs = new Set((s.data||[]).map(x => x.channel_id)); notifs = n.data || []; header();
}

function header(){
  const modBtn = (isModerator || myName === 'doruktube') ? `<button class="btn hdesk" style="border-color:rgba(255,45,61,0.4);color:#ff7a85" onclick="go('mod')">${I.shield} Mod Paneli</button>` : '';
  const c = unread();
  $('#hr').innerHTML = me 
    ? `${modBtn}<button class="btn pri hdesk" onclick="go('upload')">${I.plus} Yükle</button><button class="ibtn" onclick="go('notifications')">${I.bell}${c?`<span class="badge">${c>9?'9+':c}</span>`:''}</button><div class="lnk hdesk" onclick="go('channel','${myName}')">${av(myName)}</div>`
    : `<button class="btn hdesk" onclick="go('channels')">${I.users} Kanallar</button><button class="btn pri" onclick="go('auth')">Giriş yap</button>`;
  bottomNav();
}
function bottomNav(){
  const p = route.page, c = unread();
  $('#bn').innerHTML = `<button class="${p==='home'?'on':''}" onclick="go('home')">${I.home}Ana sayfa</button>
    <button class="${p==='channels'?'on':''}" onclick="go('channels')">${I.users}Kanallar</button>
    <button onclick="go('upload')"><span class="plus">${I.plus}</span></button>
    <button class="${p==='notifications'?'on':''}" onclick="${me?"go('notifications')":"go('auth')"}">${I.bell}Bildirim${c?`<span class="badge">${c}</span>`:''}</button>
    <button class="${p==='auth'||p==='channel'?'on':''}" onclick="${me?`go('channel','${myName}')`:"go('auth')"}">${I.user}${me?'Profil':'Giriş'}</button>`;
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if(h[0]==='video') return {page:'video', id:+h[1]};
  if(h[0]==='c') return {page:'channel', id:decodeURIComponent(h[1])};
  if(['auth','upload','channels','notifications','mod'].includes(h[0])) return {page:h[0]};
  return {page:'home'};
}
function go(page, id){ location.hash = '#/' + (id ? (page==='video'?'video/':'c/') + id : page); }
window.addEventListener('hashchange', () => { route = parseHash(); header(); render(); window.scrollTo(0,0); });

async function render(){
  const app = $('#app');
  const r = {home, video:videoPage, channel:channelPage, channels:channelsPage, notifications:notifPage, auth:authPage, upload:uploadPage, mod:modPage}[route.page];
  if(r) return r(app, route.id);
}

/* ---------- SAYFALAR ---------- */
async function home(app){
  const {data} = await sb.from('videos').select('*').order('created_at',{ascending:false});
  app.innerHTML = `<h2 class="sec"><i></i>Videolar</h2>` + (data?.length ? `<div class="grid">${data.map(v => `<div class="vcard" onclick="go('video',${v.id})"><div class="thumb noimg"><div class="play"><span>${I.play}</span></div></div><div class="vinfo">${av(v.username)}<div class="vtxt"><div class="vt">${esc(v.title)}</div><div class="vm">@${esc(v.username)}</div></div></div></div>`).join('')}</div>` : '<div class="empty">Video yok.</div>');
}

async function videoPage(app, id){
  const {data:v} = await sb.from('videos').select('*').eq('id',id).single();
  if(!v) return app.innerHTML = '<div class="empty">Video bulunamadı.</div>';
  app.innerHTML = `<div class="watch"><div>
    <video class="player" src="${esc(v.video_url)}" controls autoplay></video>
    <h1 class="wt">${esc(v.title)}</h1>
    <div class="who" style="margin:14px 0">${av(v.username)} <b>@${esc(v.username)}</b></div>
    <div class="desc">${esc(v.description||'Açıklama yok.')}</div>
  </div></div>`;
}

function authPage(app){
  if(me) return go('home');
  app.innerHTML = `<div class="panel"><h2>Giriş / Kayıt</h2><p class="sub">DorukTube'a hoş geldin!</p>
    <div class="field"><label>E-posta</label><input type="email" id="aEm" placeholder="ornek@doruktube.com"></div>
    <div class="field"><label>Şifre</label><input type="password" id="aPw"></div>
    <button class="btn pri" style="width:100%; margin-bottom:10px; padding:12px" onclick="doAuth(false)">Giriş Yap</button>
    <button class="btn" style="width:100%; padding:12px" onclick="doAuth(true)">Kayıt Ol</button></div>`;
}
async function doAuth(isReg){
  const e = $('#aEm').value, p = $('#aPw').value, un = e.split('@')[0];
  const {data, error} = isReg ? await sb.auth.signUp({email:e, password:p, options:{data:{username:un}}}) : await sb.auth.signInWithPassword({email:e, password:p});
  if(error) return toast(error.message, 'err');
  if(!isReg) { setUser(data.user); go('home'); } else toast('Kayıt başarılı! Şimdi giriş yapın.');
}

function notifPage(app){
  app.innerHTML = `<div class="nlist"><h2 class="sec"><i></i>Bildirimler</h2>
    <div class="acts" style="margin-bottom:14px">${notifs.length ? '<button class="btn" onclick="askBrowserNot()">Tarayıcı İzinlerini Aç</button>' : ''}</div>
    ${notifs.length ? notifs.map(n => `<div class="nitem" style="opacity:${n.is_read?0.7:1}"><div><div class="nt">@${esc(n.actor_username)} etkileşimde bulundu.</div></div></div>`).join('') : '<div class="empty">Bildirim yok.</div>'}</div>`;
}
function askBrowserNot() { if ('Notification' in window) Notification.requestPermission(); }
function channelsPage(app){ app.innerHTML = '<div class="empty">Kanallar listesi.</div>'; }
function channelPage(app, un){ app.innerHTML = `<div class="empty"><h2>@${esc(un)}</h2><br>${me?.user_metadata?.username===un?'<button class="btn" onclick="sb.auth.signOut().then(()=>setUser(null))">Çıkış Yap</button>':''}</div>`; }
function uploadPage(app){ app.innerHTML = '<div class="panel"><h2>Yükle</h2><div class="hint">Bu özellik yapım aşamasındadır.</div></div>'; }

/* ---------- MOD & BAN PANELİ ---------- */
async function modPage(app){
  if(!isModerator && myName !== 'doruktube') return go('home');
  app.innerHTML = `<div class="panel wide"><h2>🛡️ Mod & Ban Paneli</h2>
    <div style="background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:20px;">
      <h3 style="margin:0 0 10px; font-size:16px;">🚫 Cihaz ve Kullanıcı Banla</h3>
      <input type="text" id="banUn" placeholder="Örn: spam_kullanici" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:#fff; outline:none; margin-bottom:14px;">
      <button class="btn pri" style="width:100%; padding:12px;" onclick="banUser()">Kalıcı Olarak Banla</button>
    </div>
    <h3 style="font-size:16px; margin:16px 0 10px;">Banlanan Cihazlar Listesi</h3><div id="bannedList">Yükleniyor...</div></div>`;
  loadBannedDevices();
}
async function banUser(){
  const u = $('#banUn').value.trim(); if(!u) return;
  const devFP = btoa(u + '_banned_device_fp').replace(/=/g, ''); 
  await sb.from('banned_devices').insert({ device_fp: devFP, banned_username: u, reason: 'Topluluk kurallarına aykırı hareket.', banned_by: myName });
  await sb.from('videos').delete().eq('username', u); 
  toast(`@${u} banlandı 🚫`); $('#banUn').value=''; loadBannedDevices();
}
async function loadBannedDevices(){
  const el = $('#bannedList'); if(!el) return;
  const {data} = await sb.from('banned_devices').select('*').order('created_at',{ascending:false});
  el.innerHTML = data?.length ? data.map(b => `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px;"><div><b>@${b.banned_username||'Bilinmeyen'}</b></div><button class="btn" onclick="unbanDevice(${b.id})">Kaldır</button></div>`).join('') : '<div class="hint">Banlı cihaz yok.</div>';
}
async function unbanDevice(id){ await sb.from('banned_devices').delete().eq('id',id); toast('Ban kaldırıldı'); loadBannedDevices(); }

/* ---------- BAŞLATMA ---------- */
async function initApp() {
  if (await checkDeviceBan()) return;
  const { data } = await sb.auth.getSession();
  setUser(data?.session?.user);
  route = parseHash(); header(); render();
}
initApp();
</script>
</body>
</html>
