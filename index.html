<title>DorukTube</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0e12; --surface:#17171d; --surface2:#1f1f27; --line:rgba(255,255,255,.08);
  --tx:#f4f4f6; --mut:#9a9aa8; --red:#ff2d3d; --red2:#ff6a3d;
  --grad:linear-gradient(135deg,#ff2d3d,#ff6a3d);
  --r:18px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Lexend',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,45,61,.14),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,106,61,.08),transparent 60%);
  background-attachment:fixed}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:inherit}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(14,14,18,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 16px rgba(255,45,61,.35)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{flex:1;max-width:520px;margin:0 auto;position:relative}
.sbox input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px 11px 42px;outline:none;font-size:14px;transition:.2s}
.sbox input:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13.5px;transition:.2s;white-space:nowrap}
.btn:hover{background:#2a2a34;transform:translateY(-1px)}
.btn.pri{background:var(--grad);border:0;font-weight:600;box-shadow:0 6px 20px rgba(255,45,61,.3)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 8px 26px rgba(255,45,61,.45)}
.btn.on{background:var(--surface2);color:var(--mut)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:17px;height:17px}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 2px var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.lnk{cursor:pointer}
.lnk:hover{text-decoration:underline}

/* Layout */
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px calc(var(--nav) + 30px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--mut);transition:.2s;white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.chip.cat.on{background:var(--grad);color:#fff;border:0}
.chip:not(.on):hover{color:var(--tx);background:var(--surface2)}
h2.sec{font-size:18px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
h2.sec i{width:4px;height:18px;border-radius:4px;background:var(--grad);display:inline-block}

/* Video grid */
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,1fr)}}
.vcard{cursor:pointer;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--surface2) center/cover no-repeat;transition:.25s;box-shadow:0 0 0 1px var(--line)}
.vcard:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,45,61,.5)}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.vcard:hover .play,.thumb.noimg .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(255,45,61,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,45,61,.5)}
.play svg{width:22px;height:22px;margin-left:3px}
.ctag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:500}
.vinfo{display:flex;gap:11px;margin-top:11px}
.vtxt{min-width:0}
.vt{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{font-size:12.5px;color:var(--mut);margin-top:3px}

/* Shorts */
.shorts{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;margin-bottom:22px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shorts::-webkit-scrollbar{display:none}
.scard{flex:none;width:158px;scroll-snap-align:start;cursor:pointer;animation:up .4s both}
.scard .thumb{aspect-ratio:9/16;border-radius:16px}
@media(min-width:620px){.scard{width:190px}}

/* Skeleton */
.sk .thumb{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk .l{height:12px;border-radius:6px;margin-top:10px;background:var(--surface)}
@keyframes sh{to{background-position:-200% 0}}

/* Video page */
.watch{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){.watch{grid-template-columns:minmax(0,1fr) 380px}}
video.player{width:100%;max-height:72vh;background:#000;border-radius:var(--r);display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.wt{font-size:20px;font-weight:600;margin:16px 0 6px;line-height:1.3}
.wmeta{color:var(--mut);font-size:13px}
.wbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.who small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lk{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lk button{background:transparent;padding:9px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:.2s}
.lk button+button{border-left:1px solid var(--line)}
.lk button:hover{background:#2a2a34}
.lk button.on{background:var(--grad);font-weight:600}
.lk svg{width:17px;height:17px}
.desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.desc .tp{display:inline-block;background:rgba(255,45,61,.15);color:#ff7a85;border-radius:999px;padding:3px 11px;font-size:12px;margin:0 6px 8px 0;font-weight:500}
.comm h3{font-size:16px;margin:22px 0 12px}
.cin{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.cin input{flex:1;background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;outline:none;font-size:14px;transition:.2s}
.cin input:focus{border-color:var(--red)}
.cm{display:flex;gap:12px;padding:10px 0;animation:up .3s both}
.cm .avatar{width:34px;height:34px;font-size:14px}
.cm .b{font-size:13.5px;line-height:1.5;flex:1;min-width:0;word-break:break-word}
.cm .b small{color:var(--mut);margin-left:6px}
.cm .b b{font-weight:600}
.cm .x{color:#ff7a85;font-size:12px;background:none;padding:4px 8px;border-radius:8px}
.cm .x:hover{background:rgba(255,45,61,.12)}
.side h3{font-size:16px;margin:0 0 14px}
.rel{display:flex;gap:12px;margin-bottom:14px;cursor:pointer}
.rel .thumb{width:160px;flex:none;border-radius:12px}
.rel .vt{font-size:13.5px}

/* Kanal */
.banner{height:150px;border-radius:var(--r);margin-bottom:-44px}
.chead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:0 18px;margin-bottom:16px}
.chead .avatar{width:92px;height:92px;font-size:38px;border:4px solid var(--bg)}
.chead .ci{flex:1;min-width:180px;padding-bottom:4px}
.chead h1{margin:0;font-size:22px}
.chead .st{color:var(--mut);font-size:13px;margin-top:4px}
.bio{color:#cfcfd8;font-size:13.5px;line-height:1.6;padding:0 18px;margin-bottom:18px;white-space:pre-wrap}
.chcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.2s;animation:up .4s both}
.chcard:hover{background:var(--surface2);transform:translateY(-2px)}
.chcard .avatar{width:56px;height:56px;font-size:22px}
.chgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.chgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.chgrid{grid-template-columns:repeat(3,1fr)}}

/* Bildirim */
.nlist{max-width:680px;margin:0 auto}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.2s;animation:up .3s both}
.nitem:hover{background:var(--surface2)}
.nitem.unread{border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(255,45,61,.08),var(--surface))}
.nitem .ni{font-size:22px;line-height:1}
.nitem .nt{font-size:13.5px;line-height:1.5}
.nitem small{color:var(--mut);font-size:12px}

/* Forms */
.panel{max-width:460px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.panel.wide{max-width:600px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel p.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=password],.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:14px;transition:.2s;resize:vertical}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,45,61,.6);box-shadow:0 0 0 4px rgba(255,45,61,.12)}
.drop{display:block;border:2px dashed rgba(255,255,255,.16);border-radius:16px;padding:28px 14px;text-align:center;cursor:pointer;transition:.2s;font-size:13.5px;color:var(--mut)}
.drop:hover,.drop.over{border-color:var(--red);background:rgba(255,45,61,.06);color:var(--tx)}
.drop svg{width:34px;height:34px;color:var(--red);margin-bottom:6px}
.drop input{display:none}
.drop b{display:block;color:var(--tx);word-break:break-all}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1;padding:13px}
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:6px 0 14px;cursor:pointer}
.sw input{accent-color:var(--red);width:18px;height:18px}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:8px 0;display:none}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.hint{font-size:12px;color:var(--mut)}
.msg{font-size:13px;color:#ff8a93;min-height:20px;margin-bottom:8px}
.msg.ok{color:#7dffa0}
.empty{text-align:center;color:var(--mut);padding:60px 10px;font-size:14px}
.empty .big{font-size:42px;margin-bottom:8px}

/* Robot doğrulaması */
.cap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.cap .shield{font-size:24px}
.cap .q{flex:1;font-size:13.5px}
.cap .q b{font-size:16px;letter-spacing:1px}
.cap input{width:72px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-size:15px;outline:none}
.cap input:focus{border-color:rgba(255,45,61,.6)}
.cap .re{background:none;font-size:17px;color:var(--mut);padding:4px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* Bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(14,14,18,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
nav.bn button{position:relative;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:6px 8px;transition:.2s;min-width:56px}
nav.bn button.on{color:var(--tx)}
nav.bn svg{width:22px;height:22px}
nav.bn .badge{top:0;right:8px}
nav.bn .plus{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 20px rgba(255,45,61,.45);margin-top:-14px}
nav.bn .plus svg{width:24px;height:24px}
@media(min-width:760px){nav.bn{display:none}.wrap{padding-bottom:40px}}
@media(max-width:759px){.hdesk{display:none}.sbox{margin:0}.logo span{display:none}}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
@media(min-width:760px){#toasts{bottom:30px}}
.toast{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .25s both;pointer-events:auto}
.toast.err{border-color:rgba(255,45,61,.6)}
.toast.n{border-color:rgba(255,106,61,.6);cursor:pointer}

/* Canlı yayın */
.lvwrap{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lvwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000;max-height:none}
.lvbadge{position:absolute;left:12px;top:12px;z-index:2;background:#e5172a;border-radius:8px;padding:4px 10px 4px 9px;font-size:11.5px;font-weight:700;letter-spacing:.6px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(229,23,42,.5)}
.lvbadge::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.thumb .lvbadge{left:10px;top:10px}
@keyframes pulse{50%{opacity:.25}}
.lvview{position:absolute;right:12px;top:12px;z-index:2;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:8px;padding:4px 10px;font-size:12px}
.lvst{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:14px;text-align:center;padding:24px;line-height:1.5}
.lvmute{position:absolute;right:12px;bottom:12px;z-index:2}
.srcs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;height:min(70vh,560px)}
@media(max-width:999px){.chat{height:50vh}}
.clog{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45;word-break:break-word}
.clog .m b{color:#ffb0b6;font-weight:600;margin-right:6px}
.clog .m.h b{color:#ff6a3d}
.clog .m.h b::after{content:' • yayıncı';font-weight:400;color:var(--mut);font-size:11px}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none;font-size:13.5px}
.cform input:focus{border-color:rgba(255,45,61,.6)}
.chip.livechip{color:#ff7a85}

/* GIF */
.cgif{display:block;max-width:240px;max-height:220px;border-radius:12px;margin-top:6px;background:var(--surface2)}
.clog .cgif{max-width:200px;max-height:160px}
img.player{width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:var(--r);display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.gifbtn{cursor:pointer;padding:9px 12px;font-weight:700;font-size:12px;letter-spacing:.5px}
.gifbadge{position:absolute;right:10px;top:10px;z-index:2;background:var(--grad);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.6px}

/* Yorum ağacı */
.cthread{border-bottom:1px solid var(--line);padding:4px 0}
.cm.rep{margin-left:46px;padding-top:4px}
.cm .pin{font-size:11.5px;color:#ffb0b6;margin-bottom:3px;font-weight:500}
.cact{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cact button{background:none;color:var(--mut);font-size:12px;padding:4px 9px;border-radius:999px;transition:.2s}
.cact button:hover{background:var(--surface2);color:var(--tx)}
.cact button.del:hover{background:rgba(255,45,61,.14);color:#ff7a85}
.ced{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.ced input{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;outline:none;font-size:13.5px}
.ced .btn{padding:7px 13px;font-size:12.5px}
.crep{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mut)}
.crep b{color:var(--tx)}
.crep button,.cpin button{background:none;color:var(--mut);font-size:14px;padding:2px 6px}
.chat .crep{border-radius:0;margin:0;border-top:1px solid var(--line)}
.cpin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;background:rgba(255,45,61,.1);border-bottom:1px solid var(--line);font-size:12.5px}
.cpin b{color:#ffb0b6}
.clog .m{border-radius:10px;padding:4px 6px;margin:0 -6px}
.clog .m.sel{background:var(--surface2)}
.clog .m .cact{display:none}
.clog .m.sel .cact{display:flex}

.clog .rq{font-size:11.5px;color:var(--mut);border-left:3px solid var(--red);padding-left:8px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clog .ed{color:var(--mut)}

/* GIF seçici */
.gifm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
@media(min-width:760px){.gifm{align-items:center}}
.gifbox{width:100%;max-width:520px;height:72vh;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s both}
@media(min-width:760px){.gifbox{border-radius:22px;height:560px}}
.gifh{display:flex;gap:8px;padding:12px}
.gifh input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none;font-size:14px}
.gifh input:focus{border-color:rgba(255,45,61,.6)}
.gifg{flex:1;overflow-y:auto;columns:2;column-gap:8px;padding:0 12px 12px}
.gifg img{width:100%;display:block;border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface2);break-inside:avoid;transition:.15s}
.gifg img:hover{transform:scale(1.03)}
.gifp{text-align:center;font-size:11px;color:var(--mut);padding:8px;border-top:1px solid var(--line)}

/* Hesap ayarları */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 20px;max-width:560px}
.set h3{margin:0 0 14px;font-size:16px}
.set h4{margin:18px 0 10px;font-size:14px;color:var(--mut);font-weight:500}
.srow{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.avatar.big{width:72px;height:72px;font-size:30px}
img.avatar{object-fit:cover}

/* @etiket */
.mn{color:#ff8a93;font-weight:500}
.mn.lnk:hover{text-decoration:underline}
.clog .m.me{background:rgba(255,45,61,.12);box-shadow:inset 3px 0 0 var(--red)}
.mnbox{position:fixed;z-index:300;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:up .15s both}
.mnbox div{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:13.5px}
.mnbox div.on,.mnbox div:hover{background:var(--surface2)}
.mnbox .avatar{width:28px;height:28px;font-size:12px}

/* ---------- Yardımcılar ---------- */
function toast(t, kind, onclick){
  const d = document.createElement('div'); d.className = 'toast' + (kind==='err'?' err':kind==='n'?' n':''); d.textContent = t;
  if(onclick) d.onclick = () => { onclick(); d.remove(); };
  $('#toasts').appendChild(d); setTimeout(()=>d.remove(), 4200);
}
function ago(ts){
  const s = Math.max(1, (Date.now() - new Date(ts)) / 1000);
  const u = [[31536000,'yıl'],[2592000,'ay'],[604800,'hafta'],[86400,'gün'],[3600,'saat'],[60,'dk']];
  for(const [n,l] of u) if(s >= n) return Math.floor(s/n) + ' ' + l + ' önce';
  return 'az önce';
}
function hue(name){ let h = 0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0)) % 360; return h; }
function av(name, cls=''){
  if(typeof avatarMap !== 'undefined' && avatarMap[name]) return `<img class="avatar ${cls}" src="${esc(avatarMap[name])}" alt="" loading="lazy">`;
  const h = hue(name);
  return `<div class="avatar ${cls}" style="background:linear-gradient(135deg,hsl(${h} 80% 55%),hsl(${(h+40)%360} 80% 45%))">${esc(String(name)[0]?.toUpperCase()||'?')}</div>`;
}
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+' Mn' : n >= 1e3 ? (n/1e3).toFixed(1)+' B' : String(n);
const q1 = s => String(s).replace(/'/g, "\\'");

/* ---------- Oturum ---------- */
function setUser(u){
  const changed = (u?.id) !== (me?.id);
  me = u || null; myName = u?.user_metadata?.username || null;
  if(changed){ stopRealtime(); mySubs = new Set(); notifs = []; if(me) loadUserData(); }
  header();
}
async function loadUserData(){
  const uid = me.id;
  const [s, n] = await Promise.all([
    sb.from('subscriptions').select('channel_id').eq('subscriber_id', uid),
    sb.from('notifications').select('*').eq('user_id', uid).order('created_at',{ascending:false}).limit(60)
  ]);
  if(!me || me.id !== uid) return;
  mySubs = new Set((s.data||[]).map(x => x.channel_id));
  notifs = n.data || [];
  header(); startRealtime();
  if(route.page==='home') list();
  if(route.page==='notifications') renderNotifs();
}

  }

/* ---------- Yönlendirme (hash) ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if(h[0]==='video' && h[1]) return {page:'video', id:+h[1]};
  if(h[0]==='c' && h[1]) return {page:'channel', id:decodeURIComponent(h[1])};
  if(h[0]==='live' && h[1]) return {page:'watchlive', id:+h[1]};
  if(['auth','upload','channels','notifications','live','golive'].includes(h[0])) return {page:h[0]};
  return {page:'home'};
}
function go(page, id){
  const t = page==='home' ? '' : page==='video' ? 'video/'+id : page==='watchlive' ? 'live/'+id : page==='channel' ? 'c/'+encodeURIComponent(id) : page;
  const target = '#/' + t;
  if(location.hash === target || (page==='home' && (location.hash==='' || location.hash==='#/' ))){ route = {page,id}; header(); render(); window.scrollTo(0,0); }
  else location.hash = target;
}
window.addEventListener('hashchange', () => { route = parseHash(); header(); render(); window.scrollTo(0,0); });
async function render(){
  stopLiveCtx();
  const app = $('#app');
  const r = {live:livePage, watchlive:watchLive, golive:goLivePage, home, video:videoPage, channel:channelPage, channels:channelsPage, notifications:notifPage, auth:authPage, upload:uploadPage}[route.page];
  if(r) return r(app, route.id);
}
$('#q').addEventListener('input', e => { query = e.target.value; if(route.page==='channels') channelsPage($('#app')); else if(route.page!=='home') go('home'); else list(); });

/* ---------- Video veri düzeltmeleri ---------- */
function uniqueVideos(items){
  const seen = new Set();
  return (items || []).filter(v => {
    const key = v.video_url || `id:${v.id}`;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function needsRename(v){ return !String(v?.title || '').trim(); }
function displayTitle(v){ return needsRename(v) ? 'Yeniden adlandırılmalı' : v.title; }
function recoveryEditor(v){
  if(!me || me.id !== v.user_id || !needsRename(v)) return '';
  return `<div class="panel wide" style="margin:16px 0;border:1px solid #e5a000">
    <h3>⚠️ Video bilgilerini yeniden gir</h3>
    <p class="sub">Maalesef yaşadığımız sorundan ilgili, videoların adları silindi. Lütfen videolarınızın adını tekrar yazar mısınız?</p>
    <div class="field"><label>Yeni başlık</label><input id="recoverTitle" type="text" maxlength="100" placeholder="Video başlığını yaz"></div>
    <div class="field"><label>Kategori (isteğe bağlı)</label><select id="recoverCat"><option value="">Kategori seç</option>${cats.map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Konu (etiket)</label><input id="recoverTopic" type="text" maxlength="60" placeholder="Konu"></div>
    <div class="field"><label>Açıklama</label><textarea id="recoverDesc" rows="4" maxlength="1000" placeholder="Açıklama"></textarea></div>
    <div class="msg" id="recoverMsg"></div>
    <button class="btn pri" id="recoverSave" onclick="saveRecoveredVideo(${Number(v.id)})">Bilgileri kaydet</button>
  </div>`;
}
async function saveRecoveredVideo(id){
  if(!me) return;
  const title = ($('#recoverTitle')?.value || '').trim();
  const description = ($('#recoverDesc')?.value || '').trim();
  const topic = ($('#recoverTopic')?.value || '').trim();
  const category = $('#recoverCat')?.value || '';
  const status = $('#recoverMsg');
  if(!title){ if(status) status.textContent='Lütfen video başlığını yaz.'; return; }
  const button = $('#recoverSave'); if(button) button.disabled = true;
  if(status) status.textContent='Kaydediliyor...';
  const update = {title, description, topic, category_id:category ? Number(category) : null};
  const {data,error} = await sb.from('videos').update(update).eq('id',id).eq('user_id',me.id).select().single();
  if(error || !data){ if(status) status.textContent='Kaydedilemedi: '+(error?.message || 'Video bulunamadı.'); if(button) button.disabled=false; return; }
  allVideos = allVideos.map(v => String(v.id)===String(id) ? {...v,...data} : v);
  toast('Video bilgileri kaydedildi ✓');
  go('video', id);
}
function renderRecoveryNotice(){
  const el = $('#recoveryNotice');
  if(!el || !me) return;
  const pending = uniqueVideos(allVideos).filter(v => v.user_id===me.id && needsRename(v));
  if(!pending.length){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="panel wide" style="margin:0 0 18px;border:1px solid #e5a000">
    <h3>⚠️ Video bilgilerini yenilemen gerekiyor!</h3>
    <p>Maalesef yaşadığımız sorundan ilgili, videoların adları silindi. Lütfen videolarınızın adını tekrar yazar mısınız?</p>
    <button class="btn pri" onclick="go('video',${Number(pending[0].id)})">Videolarımı yeniden adlandır (${pending.length})</button>
  </div>`;
}

/* ---------- Kartlar ---------- */
function thumbHtml(v, tag){
  const bg = v.thumb_url ? `style="background-image:url('${esc(v.thumb_url)}')"` : '';
  const c = tag && catOf(v.category_id);
  return `<div class="thumb ${v.thumb_url?'':'noimg'}" ${bg}>${v.media_type==='gif'?'<span class="gifbadge">GIF</span>':''}${c?`<span class="ctag">${c.emoji} ${esc(c.name)}</span>`:''}<div class="play"><span>${I.play}</span></div></div>`;
}
function card(v, i=0){
  return `<div class="vcard" style="animation-delay:${Math.min(i,12)*40}ms" onclick="go('video',${v.id})">
    ${thumbHtml(v, true)}
    <div class="vinfo"><div onclick="event.stopPropagation();go('channel','${q1(v.username)}')">${av(v.username)}</div><div class="vtxt">
      <div class="vt">${esc(displayTitle(v))}</div>
      <div class="vm">@${esc(v.username)}<br>${fmt(v.views||0)} izlenme · ${ago(v.created_at)}</div>
    </div></div></div>`;
}
function scard(v, i=0){
  return `<div class="scard" style="animation-delay:${Math.min(i,12)*40}ms" onclick="go('video',${v.id})">
    ${thumbHtml(v, true)}
    <div class="vt" style="margin-top:9px;font-size:13.5px">${esc(displayTitle(v))}</div>
    <div class="vm">@${esc(v.username)} · ${fmt(v.views||0)}</div></div>`;
}
function skeleton(n=8){
  return `<div class="grid">${Array(n).fill('<div class="sk"><div class="thumb"></div><div class="l" style="width:85%"></div><div class="l" style="width:50%"></div></div>').join('')}</div>`;
}

/* ---------- Ana sayfa ---------- */
async function loadCats(){
  if(cats.length) return;
  const {data} = await sb.from('categories').select('*').order('sort');
  cats = data || [];
}
async function home(app){
  if(!allVideos.length) app.innerHTML = skeleton();
  const [{data, error}, , lv] = await Promise.all([
    sb.from('videos').select('*').order('created_at',{ascending:false}).limit(200), loadCats(), fetchLives()
  ]);
  liveNow = lv || [];
  if(route.page!=='home') return;
  if(error){ app.innerHTML = `<div class="empty"><div class="big">⚠️</div>Hata: ${esc(error.message)}<br><span class="hint">SQL kodlarını çalıştırdın mı?</span></div>`; return; }
  allVideos = uniqueVideos(data || []);
  app.innerHTML = `<div id="recoveryNotice"></div><div class="chips" id="chips"></div><div class="chips" id="cchips"></div><div id="list"></div>`;
  renderRecoveryNotice();
  list();
}
function list(){
  const chips = $('#chips'); if(!chips) return;
  const types = [['all','Tümü'],...(me?[['subs','Abonelikler']]:[]),['video','Videolar'],['short','Shortlar'],['gif','GIF']];
  if(typeF==='subs' && !me) typeF = 'all';
  chips.innerHTML = types.map(([k,l]) => `<button class="chip ${typeF===k?'on':''}" onclick="typeF='${k}';list()">${l}</button>`).join('') + `<button class="chip livechip" onclick="go('live')">🔴 Canlı${liveNow.length?' ('+liveNow.length+')':''}</button>`;
  $('#cchips').innerHTML = cats.length ? [`<button class="chip cat ${catF===null?'on':''}" onclick="catF=null;list()">Tüm kategoriler</button>`,
    ...cats.map(c => `<button class="chip cat ${catF===c.id?'on':''}" onclick="catF=${c.id};list()">${c.emoji} ${esc(c.name)}</button>`)].join('') : '';
  const q = query.trim().toLowerCase();
  const f = uniqueVideos(allVideos).filter(v => {
    if(catF!==null && v.category_id!==catF) return false;
    if(typeF==='subs' && !mySubs.has(v.user_id)) return false;
    if(!q) return true;
    const c = catOf(v.category_id);
    return String(v.title || '').toLowerCase().includes(q) || v.username.toLowerCase().includes(q) || (v.topic||'').toLowerCase().includes(q) || (c && c.name.toLowerCase().includes(q));
  });
  const gifs = f.filter(v=>v.media_type==='gif'), vids = f.filter(v=>!v.is_short && v.media_type!=='gif'), sh = f.filter(v=>v.is_short && v.media_type!=='gif');
  let h = '';
  if(typeF==='all' && catF===null && !q && liveNow.length) h += `<h2 class="sec"><i></i>🔴 Canlı yayınlar</h2><div class="grid" style="margin-bottom:26px">${liveNow.slice(0,4).map(liveCard).join('')}</div>`;
  if(typeF!=='video' && typeF!=='gif' && sh.length) h += `<h2 class="sec"><i></i>Shortlar</h2><div class="shorts">${sh.map(scard).join('')}</div>`;
  if(typeF!=='short' && typeF!=='gif' && vids.length) h += `<h2 class="sec"><i></i>Videolar</h2><div class="grid">${vids.map(card).join('')}</div>`;
  if((typeF==='all' || typeF==='gif' || typeF==='subs') && gifs.length) h += `<h2 class="sec"><i></i>GIF'ler</h2><div class="grid">${gifs.map(card).join('')}</div>`;
  if(!h) h = `<div class="empty"><div class="big">${typeF==='subs'?'🔔':'🎬'}</div>${typeF==='subs' ? (mySubs.size ? 'Abone olduğun kanallardan video yok.' : 'Henüz kimseye abone değilsin. Kanallar sayfasına göz at!') : q||catF!==null ? 'Eşleşen video yok.' : 'Henüz video yok. İlk yükleyen sen ol!'}</div>`;
  $('#list').innerHTML = h;
}

/* ---------- Abonelik ---------- */
function subBtn(cid){
  if(me && cid===me.id) return '';
  const on = mySubs.has(cid);
  return `<button class="btn subbtn ${on?'on':'pri'}" data-cid="${cid}" onclick="toggleSub('${cid}')">${on?'Abonesin ✓':'🔔 Abone ol'}</button>`;
}
async function toggleSub(cid){
  if(!me){ toast('Abone olmak için giriş yapmalısın.', 'err'); return go('auth'); }
  if(cid===me.id) return;
  const was = mySubs.has(cid);
  if(was){ const {error} = await sb.from('subscriptions').delete().eq('subscriber_id',me.id).eq('channel_id',cid); if(error) return toast(error.message,'err'); mySubs.delete(cid); }
  else { const {error} = await sb.from('subscriptions').insert({subscriber_id:me.id,channel_id:cid}); if(error) return toast(error.message,'err'); mySubs.add(cid); toast('Abone oldun 🔔'); }
  document.querySelectorAll(`.subbtn[data-cid="${cid}"]`).forEach(b => { const on = mySubs.has(cid); b.className = 'btn subbtn ' + (on?'on':'pri'); b.textContent = on?'Abonesin ✓':'🔔 Abone ol'; });
  const sc = $('#sc');
  if(sc && !(window._chp && me && window._chp.id===me.id && route.page==='channel')){ const n = Math.max(0, (+sc.dataset.n) + (was?-1:1)); sc.dataset.n = n; sc.textContent = fmt(n); }
  if(route.page==='channel' && window._chp && me && window._chp.id===me.id){ window._chFol = null; const f = $('#fc'); if(f) f.textContent = Math.max(0, (+f.textContent) + (was?-1:1)); if(window._chTab==='fol') drawPeople('fol'); }
}
async function subCount(cid){
  const {count} = await sb.from('subscriptions').select('subscriber_id',{count:'exact',head:true}).eq('channel_id',cid);
  return count || 0;
}

/* ---------- Video sayfası ---------- */
async function videoPage(app, id){
  app.innerHTML = skeleton(1);
  const {data:v, error} = await sb.from('videos').select('*').eq('id',id).single();
  if(route.page!=='video' || route.id!==id) return;
  if(error || !v){ app.innerHTML = '<div class="empty"><div class="big">🕳️</div>Video bulunamadı.</div>'; return; }
  sb.rpc('increment_views',{vid:id}).then(()=>{});
  v.views = (v.views||0) + 1;
  await loadCats();
  const [{data:likes},{data:comments},{data:others},sc] = await Promise.all([
    sb.from('likes').select('user_id,value').eq('video_id',id),
    sb.from('comments').select('*').eq('video_id',id).order('created_at',{ascending:false}),
    sb.from('videos').select('*').neq('id',id).order('created_at',{ascending:false}).limit(12),
    subCount(v.user_id)
  ]);
  if(route.page!=='video' || route.id!==id) return;
  const c = catOf(v.category_id);
  app.innerHTML = `<div class="watch">
    <div>
      ${v.media_type==='gif' ? `<img class="player" src="${esc(v.video_url)}" alt="${esc(v.title)}">` : `<video class="player" src="${esc(v.video_url)}" poster="${esc(v.thumb_url||'')}" controls playsinline autoplay></video>`}
      <h1 class="wt">${esc(displayTitle(v))}</h1>
      ${me && me.id===v.user_id && needsRename(v) ? recoveryEditor(v) : ''}
      <div class="wmeta">${fmt(v.views)} izlenme · ${ago(v.created_at)}</div>
      <div class="wbar">
        <div class="who"><div class="lnk" onclick="go('channel','${q1(v.username)}')">${av(v.username)}</div>
          <div><span class="lnk" onclick="go('channel','${q1(v.username)}')">@${esc(v.username)}</span><small><span id="sc" data-n="${sc}">${fmt(sc)}</span> abone</small></div>
          ${subBtn(v.user_id)}</div>
        <div class="acts"><div class="lk" id="lk"></div>
          <button class="btn" onclick="share('${q1(displayTitle(v))}')">${I.share} Paylaş</button></div>
      </div>
      ${needsRename(v) ? '' : `<div class="desc">${c?`<span class="tp" style="cursor:pointer" onclick="catF=${c.id};typeF='all';go('home')">${c.emoji} ${esc(c.name)}</span>`:''}${v.topic?`<span class="tp">${esc(v.topic)}</span>`:''}${(c||v.topic)?'<br>':''}${esc(v.description||'Açıklama yok.')}</div>`}
      <div class="comm">
        <h3 id="ch"></h3>
        <div id="crep" class="crep" style="display:none"></div>
        <div class="cin"><input id="ci" maxlength="500" placeholder="Yorum ekle..."><button class="btn gifbtn" onclick="openGif(u => postComment(${id}, u))">GIF</button><button class="btn pri" onclick="sendComment(${id})">Gönder</button></div>
        <div id="cl"></div>
      </div>
    </div>
    <aside class="side"><h3>Diğer videolar</h3>
      ${uniqueVideos(others||[]).map(o=>`<div class="rel" onclick="go('video',${o.id})">${thumbHtml(o)}<div class="vtxt"><div class="vt">${esc(displayTitle(o))}</div><div class="vm">@${esc(o.username)}<br>${fmt(o.views||0)} izlenme</div></div></div>`).join('') || '<div class="hint">Başka video yok.</div>'}
    </aside></div>`;
  $('#ci').addEventListener('keydown', e => { if(e.key==='Enter') sendComment(id); });
  attachMention($('#ci'));
  window._likes = likes || []; drawLikes(id);
  window._comments = comments || []; window._vowner = v.user_id; replyTo = null; editingId = null; drawComments(id);
}
async function share(t){
  const url = location.href;
  try{ if(navigator.share){ await navigator.share({title:t,url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); toast('Link kopyalandı'); }catch(e){ toast(url); }
}
function drawLikes(id){
  const L = window._likes;
  const up = L.filter(x=>x.value===1).length, dn = L.filter(x=>x.value===-1).length;
  const mine = me ? (L.find(x=>x.user_id===me.id)?.value || 0) : 0;
  $('#lk').innerHTML = `<button class="${mine===1?'on':''}" onclick="vote(${id},1)">${I.up} ${up}</button>
    <button class="${mine===-1?'on':''}" onclick="vote(${id},-1)">${I.down} ${dn}</button>`;
}
async function vote(id, val){
  if(!me){ toast('Önce giriş yapmalısın.', 'err'); return go('auth'); }
  const L = window._likes, cur = L.find(x=>x.user_id===me.id);
  if(cur && cur.value===val){
    await sb.from('likes').delete().eq('video_id',id).eq('user_id',me.id);
    window._likes = L.filter(x=>x.user_id!==me.id);
  } else {
    const {error} = await sb.from('likes').upsert({video_id:id,user_id:me.id,value:val},{onConflict:'video_id,user_id'});
    if(error) return toast(error.message, 'err');
    window._likes = L.filter(x=>x.user_id!==me.id).concat({user_id:me.id,value:val});
  }
  drawLikes(id);
}
let replyTo = null, editingId = null;
function drawComments(id){
  const C = window._comments, vo = window._vowner;
  $('#ch').textContent = `${C.length} yorum`;
  const tops = C.filter(c => !c.parent_id).sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || new Date(b.created_at)-new Date(a.created_at));
  const rep = pid => C.filter(c => c.parent_id===pid).sort((a,b) => new Date(a.created_at)-new Date(b.created_at));
  const one = (c, isReply) => {
    const mineC = me && c.user_id===me.id, isVO = me && vo===me.id, g = gifUrl(c.content);
    const body = editingId===c.id
      ? `<div class="ced"><input id="ced" maxlength="500" value="${esc(c.content)}"><button class="btn pri" onclick="saveEdit(${c.id},${id})">Kaydet</button><button class="btn" onclick="editingId=null;drawComments(${id})">İptal</button></div>`
      : (g ? `<img class="cgif" src="${esc(g)}" loading="lazy" alt="GIF">` : mention(c.content));
    return `<div class="cm ${isReply?'rep':''}"><div class="lnk" onclick="go('channel','${q1(c.username)}')">${av(c.username)}</div>
      <div class="b">${c.pinned?'<div class="pin">📌 Sabitlendi</div>':''}
        <b class="lnk" onclick="go('channel','${q1(c.username)}')">@${esc(c.username)}</b><small>${ago(c.created_at)}${c.edited_at?' · düzenlendi':''}</small><br>${body}
        <div class="cact">
          ${me ? `<button onclick="setReply(${isReply?c.parent_id:c.id},'${q1(c.username)}')">Yanıtla</button>` : ''}
          ${mineC && !g ? `<button onclick="startEdit(${c.id},${id})">Düzenle</button>` : ''}
          ${(mineC||isVO) ? `<button class="del" onclick="delComment(${c.id},${id})">Sil</button>` : ''}
          ${isVO && !isReply ? `<button onclick="pinComment(${c.id},${c.pinned?'false':'true'},${id})">${c.pinned?'Sabitlemeyi kaldır':'Sabitle'}</button>` : ''}
        </div></div></div>`;
  };
  $('#cl').innerHTML = tops.length ? tops.map(c => `<div class="cthread">${one(c,false)}${rep(c.id).map(r => one(r,true)).join('')}</div>`).join('') : '<div class="hint">İlk yorumu sen yap.</div>';
  if(editingId){ const e = $('#ced'); if(e){ attachMention(e); e.focus(); e.setSelectionRange(e.value.length, e.value.length); e.onkeydown = ev => { if(ev.key==='Enter') saveEdit(editingId, id); if(ev.key==='Escape'){ editingId = null; drawComments(id); } }; } }
}
function setReply(parentId, user){
  if(!me) return;
  replyTo = {id:parentId, user};
  const r = $('#crep'); r.style.display = 'flex'; r.innerHTML = `<span>↩ <b>@${esc(user)}</b> kullanıcısına yanıt veriyorsun</span><button onclick="clearReply()">✕</button>`;
  const i = $('#ci'); i.value = '@' + user + ' '; i.focus();
}
function clearReply(){ replyTo = null; const r = $('#crep'); if(r){ r.style.display = 'none'; r.innerHTML = ''; } }
async function postComment(id, text){
  if(!me){ toast('Yorum için giriş yapmalısın.', 'err'); return go('auth'); }
  const row = {video_id:id, user_id:me.id, username:myName, content:text};
  if(replyTo) row.parent_id = replyTo.id;
  const {data, error} = await sb.from('comments').insert(row).select().single();
  if(error) return toast(error.message + (replyTo ? ' (update-v6.sql çalıştırıldı mı?)' : ''), 'err');
  window._comments.push(data); clearReply(); const i = $('#ci'); if(i) i.value = ''; drawComments(id);
}
async function sendComment(id){
  const t = $('#ci').value.trim(); if(!t) return;
  if(replyTo && t === '@' + replyTo.user) return;
  postComment(id, t);
}
function startEdit(cid, id){ editingId = cid; drawComments(id); }
async function saveEdit(cid, id){
  const t = ($('#ced').value || '').trim(); if(!t) return;
  const c = window._comments.find(x => x.id===cid); if(!c || t === c.content){ editingId = null; return drawComments(id); }
  const {data, error} = await sb.from('comments').update({content:t, edited_at:new Date().toISOString()}).eq('id',cid).select().single();
  if(error) return toast(error.message + ' (update-v6.sql çalıştırıldı mı?)', 'err');
  Object.assign(c, data); editingId = null; drawComments(id);
}
async function delComment(cid, id){
  if(!confirm('Bu yorum silinsin mi?')) return;
  const {error} = await sb.from('comments').delete().eq('id',cid);
  if(error) return toast(error.message, 'err');
  window._comments = window._comments.filter(c => c.id!==cid && c.parent_id!==cid); drawComments(id);
}
async function pinComment(cid, pin, id){
  const {error} = await sb.rpc('pin_comment', {cid, pin});
  if(error) return toast(error.message + ' (update-v6.sql çalıştırıldı mı?)', 'err');
  window._comments.forEach(c => { if(c.id===cid) c.pinned = pin; else if(pin) c.pinned = false; });
  toast(pin ? 'Yorum sabitlendi 📌' : 'Sabitleme kaldırıldı'); drawComments(id);
}

/* ---------- GIF seçici (Giphy) ---------- */
function gifUrl(t){
  t = String(t||'').trim();
  if(!/^https:\/\/\S+\.gif(\?\S*)?$/i.test(t)) return null;
  try{
    const h = new URL(t).hostname;
    if(h === new URL(SUPABASE_URL).hostname || /^(media\d*|i)\.giphy\.com$/.test(h) || /^(media|c)\.tenor\.com$/.test(h)) return t;
  }catch(e){}
  return null;
}
function gifImg(url){ const i = document.createElement('img'); i.className = 'cgif'; i.src = url; i.loading = 'lazy'; i.alt = 'GIF'; return i; }
let gifCb = null, gifTimer = null;
function openGif(cb){
  if(!me){ toast('GIF göndermek için giriş yapmalısın.', 'err'); return go('auth'); }
  gifCb = cb;
  let m = $('#gifm'); if(!m){ m = document.createElement('div'); m.id = 'gifm'; m.className = 'gifm'; document.body.appendChild(m); }
  m.innerHTML = `<div class="gifbox"><div class="gifh"><input id="gifq" placeholder="GIF ara..." autocomplete="off"><button class="btn" onclick="closeGif()">✕</button></div>
    <div class="gifg" id="gifg"></div><div class="gifp">Powered by GIPHY</div></div>`;
  m.style.display = 'flex'; m.onclick = e => { if(e.target === m) closeGif(); };
  $('#gifq').addEventListener('input', e => { clearTimeout(gifTimer); gifTimer = setTimeout(() => gifSearch(e.target.value), 350); });
  gifSearch(''); $('#gifq').focus();
}
function closeGif(){ const m = $('#gifm'); if(m) m.style.display = 'none'; gifCb = null; }
async function gifSearch(q){
  const g = $('#gifg'); if(!g) return; q = q.trim();
  if(!GIPHY_API_KEY){ g.innerHTML = '<div class="hint" style="padding:18px;line-height:1.6">GIF arama için Giphy API anahtarı gerekli.<br>developers.giphy.com\'dan ücretsiz anahtar alıp <b>index.html</b> içindeki <b>GIPHY_API_KEY</b> satırına yaz.</div>'; return; }
  g.innerHTML = '<div class="hint" style="padding:18px">Yükleniyor...</div>';
  try{
    const u = `https://api.giphy.com/v1/gifs/${q ? 'search' : 'trending'}?api_key=${encodeURIComponent(GIPHY_API_KEY)}&limit=24&rating=pg&lang=tr${q ? '&q=' + encodeURIComponent(q) : ''}`;
    const r = await fetch(u); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    window._gl = (j.data || []).map(x => ({s:x.images.fixed_height_small.url, u:x.images.fixed_height.url}));
    g.innerHTML = window._gl.length ? window._gl.map((x,i) => `<img src="${esc(x.s)}" loading="lazy" alt="GIF" onclick="pickGif(${i})">`).join('') : '<div class="hint" style="padding:18px">Sonuç bulunamadı.</div>';
  }catch(e){ g.innerHTML = '<div class="hint" style="padding:18px">GIF\'ler yüklenemedi. Anahtarı kontrol et.</div>'; }
}
function pickGif(i){
  const x = window._gl[i], cb = gifCb; if(!x || !cb) return;
  if(!gifUrl(x.u)) return toast('Bu GIF kullanılamıyor.', 'err');
  closeGif(); cb(x.u);
}

/* ---------- Profil fotoğrafı ---------- */
let avatarMap = {}, userList = [], userSet = new Set();
async function loadAvatars(){
  try{ const {data} = await sb.from('profiles').select('username,avatar_url').limit(3000);
    (data||[]).forEach(p => { if(p.avatar_url) avatarMap[p.username] = p.avatar_url; userSet.add(p.username); });
    userList = [...userSet].sort((a,b) => a.localeCompare(b)); }catch(e){}
}
async function squareJpeg(file, size){
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height), c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s)/2, (bmp.height - s)/2, s, s, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Resim işlenemedi')), 'image/jpeg', 0.86));
}
async function pickAvatar(input){
  const f = input.files[0]; input.value = ''; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('Bir resim dosyası seç.', 'err');
  if(f.size > 8*1024*1024) return toast('Resim 8 MB\'tan küçük olmalı.', 'err');
  toast('Yükleniyor...');
  try{
    const blob = await squareJpeg(f, 256);
    const path = `${me.id}/avatar_${Date.now()}.jpg`;
    const {error:e1} = await sb.storage.from('videos').upload(path, blob, {contentType:'image/jpeg'}); if(e1) throw e1;
    const url = sb.storage.from('videos').getPublicUrl(path).data.publicUrl;
    const {error:e2} = await sb.from('profiles').update({avatar_url:url}).eq('id', me.id); if(e2) throw e2;
    avatarMap[myName] = url; toast('Profil fotoğrafı güncellendi ✓'); go('channel', myName);
  }catch(e){ toast('Hata: ' + (e.message||e) + ' (update-v6.sql çalıştırıldı mı?)', 'err'); }
}
async function removeAvatar(){
  const {error} = await sb.from('profiles').update({avatar_url:null}).eq('id', me.id);
  if(error) return toast(error.message, 'err');
  delete avatarMap[myName]; toast('Fotoğraf kaldırıldı'); go('channel', myName);
}

/* ---------- @etiketleme ---------- */
const MN_RE = /@([A-Za-z0-9_]{3,20})/g;
function mention(text){
  return esc(text).replace(MN_RE, (m, n) => userSet.has(n) ? `<span class="mn lnk" onclick="go('channel','${n}')">@${n}</span>` : m);
}
function mentionsMe(t){ return !!(me && myName && new RegExp('(^|[^A-Za-z0-9_])@' + myName + '(?![A-Za-z0-9_])').test(String(t))); }
function appendMentions(d, text){   // sohbet için: bağlantı değil, sadece vurgu (yayıncı yanlışlıkla sayfadan ayrılmasın)
  let last = 0;
  text.replace(MN_RE, (m, n, off) => {
    if(!userSet.has(n)) return m;
    if(off > last) d.appendChild(document.createTextNode(text.slice(last, off)));
    const s = document.createElement('span'); s.className = 'mn'; s.textContent = m; d.appendChild(s);
    last = off + m.length; return m;
  });
  if(last < text.length) d.appendChild(document.createTextNode(text.slice(last)));
}
function attachMention(inp){
  if(!inp || inp._mn) return; inp._mn = true;
  let box = null, items = [], idx = 0, start = -1;
  const close = () => { if(box){ box.remove(); box = null; } items = []; };
  const pick = n => {
    const v = inp.value, pos = inp.selectionStart;
    inp.value = v.slice(0, start) + '@' + n + ' ' + v.slice(pos);
    const c = start + n.length + 2; inp.setSelectionRange(c, c); close(); inp.focus();
  };
  const render = () => {
    if(!box){ box = document.createElement('div'); box.className = 'mnbox'; document.body.appendChild(box); }
    box.innerHTML = items.map((n,i) => `<div class="${i===idx?'on':''}" data-n="${n}">${av(n)}<span>@${n}</span></div>`).join('');
    const r = inp.getBoundingClientRect(), h = items.length * 42 + 8;
    const below = window.innerHeight - r.bottom > h + 10;
    box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 248)) + 'px';
    box.style.top = (below ? r.bottom + 6 : r.top - h - 6) + 'px';
    box.querySelectorAll('[data-n]').forEach(el => { el.onmousedown = ev => { ev.preventDefault(); pick(el.dataset.n); }; });
  };
  const update = () => {
    const pos = inp.selectionStart, m = /(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{0,20})$/.exec(inp.value.slice(0, pos));
    if(!m) return close();
    start = pos - m[2].length - 1; const q = m[2].toLowerCase();
    items = userList.filter(n => n !== myName && n.toLowerCase().startsWith(q)).slice(0, 6);
    if(!items.length) return close(); idx = 0; render();
  };
  inp.addEventListener('input', update);
  inp.addEventListener('blur', () => setTimeout(close, 150));
  inp.addEventListener('keydown', e => {
    if(!box) return;
    if(e.key==='ArrowDown'){ idx = (idx + 1) % items.length; render(); }
    else if(e.key==='ArrowUp'){ idx = (idx - 1 + items.length) % items.length; render(); }
    else if(e.key==='Enter' || e.key==='Tab'){ pick(items[idx]); }
    else if(e.key==='Escape'){ close(); }
    else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);
}

async function loadPeople(kind){
  const key = kind==='subs' ? '_chSubs' : '_chFol';
  if(window[key]) return window[key];
  const pid = window._chp.id;
  const {data:rows} = kind==='subs'
    ? await sb.from('subscriptions').select('subscriber_id,created_at').eq('channel_id', pid).order('created_at',{ascending:false})
    : await sb.from('subscriptions').select('channel_id,created_at').eq('subscriber_id', pid).order('created_at',{ascending:false});
  const ids = (rows||[]).map(r => kind==='subs' ? r.subscriber_id : r.channel_id);
  let names = {};
  if(ids.length){ const {data:ps} = await sb.from('profiles').select('id,username').in('id', ids); (ps||[]).forEach(x => names[x.id] = x.username); }
  window[key] = (rows||[]).map(r => { const id = kind==='subs' ? r.subscriber_id : r.channel_id; return {id, username:names[id], at:r.created_at}; }).filter(x => x.username);
  return window[key];
}

/* ---------- Bildirimler ---------- */
const NI = {video:'🎬', comment:'💬', like:'👍', sub:'🔔', live:'🔴', reply:'↩️', mention:'📣'};
function ntext(n){
  const a = `@${n.actor_username}`, t = n.video_title ? ` “${n.video_title}”` : '';
  return n.type==='video' ? `${a} yeni video yükledi:${t}` : n.type==='comment' ? `${a} videona yorum yaptı:${t}` : n.type==='like' ? `${a} videonu beğendi:${t}` : n.type==='mention' ? `${a} seni bir yorumda etiketledi:${t}` : n.type==='reply' ? `${a} yorumuna yanıt verdi:${t}` : n.type==='live' ? `${a} canlı yayına başladı:${t}` : `${a} kanalına abone oldu`;
}
function openNotif(n){
  if(!n.is_read) markRead(n.id);
  if(n.live_id) go('watchlive', n.live_id); else if(n.video_id) go('video', n.video_id); else go('channel', n.actor_username);
}
async function markRead(id){
  const n = notifs.find(x=>x.id===id); if(n) n.is_read = true;
  header(); sb.from('notifications').update({is_read:true}).eq('id',id).then(()=>{});
}
async function readAll(){
  notifs.forEach(n => n.is_read = true); header(); renderNotifs();
  await sb.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false);
}
async function clearAll(){
  if(!confirm('Tüm bildirimler silinsin mi?')) return;
  notifs = []; header(); renderNotifs();

    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${me.id}`}, p => {

/* ---------- Robot doğrulaması ---------- */
let cap = {a:0,b:0,t:0,ts:null};
function newCap(){ cap.a = 2 + Math.floor(Math.random()*8); cap.b = 2 + Math.floor(Math.random()*8); cap.t = Date.now(); const q = $('#capq'); if(q) q.innerHTML = `<b>${cap.a} + ${cap.b} = ?</b>`; const i = $('#capa'); if(i) i.value=''; }
function capHtml(){
  if(TURNSTILE_SITE_KEY) return `<div id="ts" style="margin-bottom:14px"></div>`;
  return `<div class="cap"><span class="shield">🤖</span><div class="q">Robot olmadığını doğrula<br><span id="capq"></span></div>
    <input id="capa" inputmode="numeric" maxlength="2" autocomplete="off"><button class="re" type="button" onclick="newCap()" title="Yenile">↻</button></div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">`;
}
function capInit(){
  if(TURNSTILE_SITE_KEY){
    const go2 = () => { cap.ts = turnstile.render('#ts', {sitekey:TURNSTILE_SITE_KEY, theme:'dark'}); };
    if(window.turnstile) go2();
    else { const s = document.createElement('script'); s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.onload = go2; document.head.appendChild(s); }
  } else newCap();
}
/* null → başarısız; "" → yerleşik doğrulama geçti; "token" → Turnstile */
function capCheck(){
  if(TURNSTILE_SITE_KEY){
    const t = window.turnstile && cap.ts !== null ? turnstile.getResponse(cap.ts) : '';
    if(!t){ msg('Lütfen robot doğrulamasını tamamla.'); return null; }
    return t;
  }
  if($('#hp').value){ msg('Doğrulama başarısız.'); return null; }
  if(Date.now() - cap.t < 1500){ msg('Biraz yavaş ol, doğrulama için bekle.'); return null; }
  if(parseInt($('#capa').value,10) !== cap.a + cap.b){ msg('Robot doğrulaması yanlış, tekrar dene.'); newCap(); return null; }
  return '';
}

function authPage(app){
  app.innerHTML = `<div class="panel">
    <h2>Hoş geldin 👋</h2><p class="sub">Kullanıcı adın ve şifrenle giriş yap ya da yeni hesap aç.</p>
    <div class="field"><label>Kullanıcı adı</label><input type="text" id="un" autocapitalize="none" autocomplete="username" placeholder="ornek_kullanici"></div>
    <div class="field"><label>Şifre</label><input type="password" id="pw" autocomplete="current-password" placeholder="En az 6 karakter"></div>
    ${capHtml()}
    <div class="msg" id="msg"></div>
    <div class="row2"><button class="btn pri" onclick="login()">Giriş yap</button><button class="btn" onclick="register()">Kayıt ol</button></div>
    <p class="hint" style="margin-top:14px">Kullanıcı adı 3-20 karakter: harf, rakam ve _</p></div>`;
  $('#pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  capInit();
}
function readAuth(){
  const u = $('#un').value.trim(), p = $('#pw').value;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){ msg('Kullanıcı adı 3-20 karakter olmalı (harf, rakam, _).'); return null; }
  if(p.length<6){ msg('Şifre en az 6 karakter olmalı.'); return null; }
  const c = capCheck(); if(c === null) return null;
  return {u, p, captchaToken: c || undefined};
}
function msg(t,ok){ const m=$('#msg'); if(!m) return; m.textContent=t; m.className='msg'+(ok?' ok':''); }
function capReset(){ if(TURNSTILE_SITE_KEY && window.turnstile) try{ turnstile.reset(cap.ts); }catch(e){} else newCap(); }
async function register(){
  const a = readAuth(); if(!a) return;
  msg('Kayıt yapılıyor...',true);
  const {data,error} = await sb.auth.signUp({email:emailOf(a.u),password:a.p,options:{data:{username:a.u},captchaToken:a.captchaToken}});
  if(error){ msg(/already|registered|Database error/i.test(error.message) ? 'Bu kullanıcı adı alınmış.' : /captcha/i.test(error.message) ? 'Robot doğrulaması reddedildi.' : error.message); capReset(); return; }
  if(!data.session){ msg('Kayıt oldu ama oturum açılmadı. Supabase\'de "Confirm email" kapalı olmalı.'); return; }
  toast('Hoş geldin @' + a.u); go('home');
}
async function login(){
  const a = readAuth(); if(!a) return;
  msg('Giriş yapılıyor...',true);
  const {error} = await sb.auth.signInWithPassword({email:emailOf(a.u),password:a.p,options:{captchaToken:a.captchaToken}});
  if(error){ msg(/captcha/i.test(error.message) ? 'Robot doğrulaması reddedildi.' : 'Kullanıcı adı veya şifre hatalı.'); capReset(); return; }
  toast('Giriş yapıldı'); go('home');
}
async function logout(){ await sb.auth.signOut(); toast('Çıkış yapıldı'); go('home'); }

function makeThumb(file){
  return new Promise(res=>{
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
    const done = b => { URL.revokeObjectURL(url); res(b); };
    v.onerror = () => done(null);
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration||1)/2); };
    v.onseeked = () => {
      const c = document.createElement('canvas');
      const w = Math.min(640, v.videoWidth||640);
      c.width = w; c.height = Math.round(w * (v.videoHeight||360) / (v.videoWidth||640));
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      c.toBlob(b=>done(b),'image/jpeg',0.8);
    };
    setTimeout(()=>done(null),10000);
  });
}
function detectHorizontal(file){
  return new Promise(resolve=>{
    const url = URL.createObjectURL(file);
    const video = document.createElement('video');
    let finished = false;
    const done = value => { if(finished) return; finished=true; URL.revokeObjectURL(url); resolve(value); };
    video.preload='metadata';
    video.onloadedmetadata=()=>done(video.videoWidth > video.videoHeight);
    video.onerror=()=>done(false);
    video.src=url;
    setTimeout(()=>done(false),10000);
  });
}
async function upload(){
  const f = $('#vf').files[0], title = $('#vt').value.trim();
  const isGif = !!f && (/gif$/i.test(f.type) || /\.gif$/i.test(f.name));
  if(!f) return msg('Bir video ya da GIF seç.');
  if(!title) return msg('Başlık yaz.');
  if(f.size > 50*1024*1024) return msg('Dosya 50 MB\'dan büyük.');
  const isHorizontal = !isGif && await detectHorizontal(f);
  $('#ub').disabled = true; $('#pr').style.display='block'; $('#pb').style.width='20%';
  msg('Yükleniyor...',true);
  try{
    const stamp = Date.now();
    const ext = (f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');
    const vpath = `${me.id}/${stamp}.${ext}`;

function dur(ms){ const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }

function wireChat(){ const i = $('#cin'); if(i) attachMention(i); if(i) i.addEventListener('keydown', e => { if(e.key==='Enter') chatSend(); }); for(const k in chatMsgs) delete chatMsgs[k]; chatReply = null; }
const chatMsgs = {}; let chatReply = null, lastChat = 0;
const isHostNow = () => !!(liveCtx && liveCtx.kind==='host');
const chatShort = m => gifUrl(m.t) ? 'GIF' : String(m.t).slice(0,60);

function chatFill(d, p){
  d.innerHTML = '';
  if(p.r){ const q = document.createElement('div'); q.className = 'rq'; q.textContent = '↩ @' + p.r.u + ': ' + p.r.t; d.appendChild(q); }
  const b = document.createElement('b'); b.textContent = '@' + String(p.u||'').slice(0,20); d.appendChild(b);

    add('Yanıtla', () => chatSetReply(p.id));
    if(p.u === myName && !gu) add('Düzenle', () => chatEditMsg(p.id));
    if(p.u === myName || isHostNow()) add('Sil', () => chatDelMsg(p.id), 'del');
    if(isHostNow()) add('Sabitle', () => chatPinMsg(p.id));
    d.appendChild(act);

}
function chatAdd(p){
  const log = $('#clog'); if(!log || !p || !p.t || !p.id || chatMsgs[p.id]) return;
  chatMsgs[p.id] = {id:p.id, u:p.u, t:p.t, h:!!p.h, r:p.r||null};
  const d = document.createElement('div'); d.className = 'm' + (p.h ? ' h' : ''); d.dataset.id = p.id;
  d.onclick = () => d.classList.toggle('sel');

  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  log.appendChild(d); while(log.children.length > 150) log.removeChild(log.firstChild);
  if(near) log.scrollTop = log.scrollHeight;
}
function chatEl(id){ return document.querySelector(`#clog .m[data-id="${id}"]`); }
function chatSetReply(id){
  const m = chatMsgs[id]; if(!m) return;

  const r = $('#ccrep'); r.style.display = 'flex'; r.innerHTML = `<span>↩ <b>@${esc(m.u)}</b>: ${esc(chatReply.t)}</span><button onclick="chatClearReply()">✕</button>`;

}
function chatClearReply(){ chatReply = null; const r = $('#ccrep'); if(r){ r.style.display = 'none'; r.innerHTML = ''; } }
function chatSendRaw(t){
  if(!me || !liveCtx || !liveCtx.ch) return; t = String(t).trim(); if(!t) return;
  if(Date.now() - lastChat < 1200) return toast('Biraz yavaş :)', 'err');
  lastChat = Date.now();
  const p = {id:Math.random().toString(36).slice(2,9) + Date.now().toString(36), u:myName, t, h:isHostNow(), r:chatReply ? {u:chatReply.u, t:chatReply.t} : null};
  chatClearReply(); bsend(liveCtx.ch, 'chat', p); chatAdd(p);
}
function chatSend(){ const i = $('#cin'); if(!i || !i.value.trim()) return; const t = i.value; chatSendRaw(t); if(Date.now() - lastChat < 100) i.value = ''; }
function chatEditMsg(id){
  const m = chatMsgs[id]; if(!m || m.u !== myName) return;
  const nt = prompt('Mesajı düzenle', m.t); if(nt === null) return;
  const t = nt.trim().slice(0,200); if(!t || t === m.t) return;
  chatApplyEdit({id, u:myName, t}); bsend(liveCtx.ch, 'chatedit', {id, u:myName, t});
}
function chatApplyEdit({id, u, t}){
  const m = chatMsgs[id]; if(!m || m.u !== u || !t) return;
  m.t = String(t).slice(0,200); m.edited = true; const d = chatEl(id); if(d) chatFill(d, m);
}
function chatDelMsg(id){
  const m = chatMsgs[id]; if(!m) return; if(m.u !== myName && !isHostNow()) return;
  if(!confirm('Mesaj silinsin mi?')) return;
  bsend(liveCtx.ch, 'chatdel', {id, u:myName, h:isHostNow()}); chatApplyDel({id, u:myName, h:isHostNow()});
}
function chatApplyDel({id, u, h}){
  const m = chatMsgs[id]; if(!m || !(m.u === u || h === true)) return;
  const d = chatEl(id); if(d) d.remove(); delete chatMsgs[id];
  if(liveCtx && liveCtx.pin && liveCtx.pin.id === id){ liveCtx.pin = null; showPin(null); }
}
function chatPinMsg(id){
  const m = chatMsgs[id]; if(!m || !isHostNow()) return;
  const p = {id, u:m.u, t:m.t, h:true}; liveCtx.pin = p; showPin(p); bsend(liveCtx.ch, 'chatpin', p);
}
function chatUnpin(){ if(!isHostNow()) return; liveCtx.pin = null; showPin(null); bsend(liveCtx.ch, 'chatpin', {clear:true, h:true}); }
function chatApplyPin(p){
  if(!p || p.h !== true) return;
  if(liveCtx) liveCtx.pin = p.clear ? null : p;
  showPin(p.clear ? null : p);
}
function showPin(p){

async function pickSource(kind){

  st.getVideoTracks()[0].onended = () => { if(S.live && !S.ended){ toast('Yayın kaynağı kapandı, yayın bitti.', 'err'); go('live'); } };
}
async function startBroadcast(){
  const S = liveCtx; if(!S || S.kind!=='host' || !S.stream || S.live) return;
  const title = $('#lt').value.trim(); if(!title) return msg('Yayına bir başlık yaz.');
  $('#lgo').disabled = true; msg('Yayın başlıyor...', true);
  await sb.from('lives').update({is_live:false, ended_at:new Date().toISOString()}).eq('user_id',me.id).eq('is_live',true);

  const {data:live, error} = await sb.from('lives').insert(row).select().single();
  if(error){ $('#lgo').disabled = false; return msg('Hata: ' + error.message + ' (update-v4.sql çalıştırıldı mı?)'); }
  if(S.ended) return;
  S.live = live; S.t0 = Date.now();
  const ch = S.ch = sb.channel('live:' + live.id);
  ch.on('broadcast',{event:'join'},   ({payload}) => hostJoin(S, payload.vid))
    .on('broadcast',{event:'answer'}, ({payload}) => hostAnswer(S, payload))
    .on('broadcast',{event:'ice'},    ({payload}) => { if(payload.to!=='host') return; const p = S.peers[payload.from]; if(p) addIce(p, payload.c); })
    .on('broadcast',{event:'leave'},  ({payload}) => hostDrop(S, payload.vid))
    .on('broadcast',{event:'chat'},   ({payload}) => chatAdd(payload))
    .on('broadcast',{event:'chatedit'},({payload}) => chatApplyEdit(payload))
    .on('broadcast',{event:'chatdel'}, ({payload}) => chatApplyDel(payload))
    .subscribe();
  S.timers.push(setInterval(() => { sb.from('lives').update({last_ping:new Date().toISOString()}).eq('id',live.id).then(()=>{}); }, 20000));
  S.timers.push(setInterval(() => { const el = $('#lt2'); if(el) el.textContent = dur(Date.now() - S.t0); }, 1000));
  window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; };
  $('#app').innerHTML = `<div class="watch"><div>
      <div class="lvwrap"><span class="lvbadge">CANLI</span><span class="lvview">👁 <b id="vc">0</b> · <span id="lt2">0:00</span></span><video id="pv" autoplay muted playsinline></video></div>
      <h1 class="wt">${esc(live.title)}</h1>
      <div class="acts" style="margin:12px 0"><button class="btn" onclick="copyLiveLink()">🔗 Linki kopyala</button><button class="btn pri" onclick="endLive()">⏹ Yayını bitir</button></div>
      <div class="hint">Kamera/ekran açık kaldığı sürece yayındasın. Bu sayfadan ayrılırsan yayın biter.</div></div>
    <aside class="side">${chatBox()}</aside></div>`;
  $('#pv').srcObject = S.stream; wireChat();
  toast('Yayındasın 🔴');
}
async function hostJoin(S, vid){
  if(S.ended || !vid || !S.stream) return;
  if(S.pin) bsend(S.ch,'chatpin',S.pin);
  const old = S.peers[vid];
  if(old && !['failed','closed'].includes(old.pc.connectionState) && Date.now() - old.t < 5000) return;
  if(old){ try{ old.pc.close(); }catch(e){} delete S.peers[vid]; }
  if(Object.keys(S.peers).length >= MAX_VIEWERS){ bsend(S.ch,'full',{to:vid}); return; }
  const pc = new RTCPeerConnection(ICE), p = S.peers[vid] = {pc, q:[], t:Date.now()};
  S.stream.getTracks().forEach(t => pc.addTrack(t, S.stream));
  let sent = false; const buf = [];
  const sendIce = c => bsend(S.ch,'ice',{to:vid, from:'host', c});
  pc.onicecandidate = e => { if(!e.candidate) return; sent ? sendIce(e.candidate) : buf.push(e.candidate); };
  pc.onconnectionstatechange = () => { if(['failed','closed'].includes(pc.connectionState) && S.peers[vid]===p) delete S.peers[vid]; hostCount(S); };
  try{
    await pc.setLocalDescription(await pc.createOffer());
    await bsend(S.ch,'offer',{to:vid, sdp:pc.localDescription});
    sent = true; buf.forEach(sendIce);
  }catch(e){ console.warn(e); }
}
async function hostAnswer(S, {from, sdp}){
  const p = S.peers[from]; if(!p) return;
  try{ await p.pc.setRemoteDescription(sdp); p.q.forEach(c => p.pc.addIceCandidate(c).catch(()=>{})); p.q = []; }catch(e){ console.warn(e); }
}
function hostDrop(S, vid){ const p = S.peers[vid]; if(p){ try{ p.pc.close(); }catch(e){} delete S.peers[vid]; } hostCount(S); }
function hostCount(S){
  const n = Object.values(S.peers).filter(p => p.pc.connectionState==='connected').length;
  const el = $('#vc'); if(el) el.textContent = n;
  if(n !== S.lastN && S.ch){ S.lastN = n; bsend(S.ch,'count',{n}); }
}
function copyLiveLink(){ const id = liveCtx && liveCtx.live && liveCtx.live.id; const u = location.href.split('#')[0] + '#/live/' + id; navigator.clipboard.writeText(u).then(() => toast('Yayın linki kopyalandı'), () => toast(u)); }
function endLive(){ if(confirm('Yayın bitirilsin mi?')) go('live'); }

      pc.onicecandidate = e => { if(!e.candidate) return; sent ? sIce(e.candidate) : buf.push(e.candidate); };
      pc.onconnectionstatechange = () => {
        if(pc !== mine) return; const s = pc.connectionState;
        if(s==='connected'){ connected = true; clearInterval(joinT); setSt(''); }
        else if(s==='failed' || s==='closed'){ setSt('Bağlantı koptu, yeniden bağlanılıyor…'); startJoin(); }
        else if(s==='disconnected') setSt('Bağlantı zayıf…');
      };
      try{
        await pc.setRemoteDescription(payload.sdp);
        q.forEach(c => pc.addIceCandidate(c).catch(()=>{})); q = [];
        await pc.setLocalDescription(await pc.createAnswer());
        await bsend(ch,'answer',{from:vid, sdp:pc.localDescription});
        sent = true; buf.forEach(sIce);
      }catch(e){ console.warn(e); }
    })
    .on('broadcast',{event:'ice'},   ({payload}) => { if(payload.to !== vid || !pc) return; pc.remoteDescription ? pc.addIceCandidate(payload.c).catch(()=>{}) : q.push(payload.c); })
    .on('broadcast',{event:'count'}, ({payload}) => { const e = $('#vc'); if(e) e.textContent = payload.n; })
    .on('broadcast',{event:'chat'},  ({payload}) => chatAdd(payload))
    .on('broadcast',{event:'chatedit'},({payload}) => chatApplyEdit(payload))
    .on('broadcast',{event:'chatdel'}, ({payload}) => chatApplyDel(payload))
    .on('broadcast',{event:'chatpin'}, ({payload}) => chatApplyPin(payload))
    .on('broadcast',{event:'full'},  ({payload}) => { if(payload.to === vid){ clearInterval(joinT); setSt('Yayın şu an dolu (en fazla ' + MAX_VIEWERS + ' izleyici). Biraz sonra tekrar dene.'); } })
    .on('broadcast',{event:'end'},   () => { clearInterval(joinT); connected = true; try{ if(pc) pc.close(); }catch(e){} v.srcObject = null; setSt('Yayın sona erdi. 👋'); })
    .subscribe(s => { if(s === 'SUBSCRIBED') startJoin(); });
}
function unmuteLive(){ const v = $('#lv'); if(v){ v.muted = false; v.play().catch(()=>{}); } const m = $('#lvm'); if(m) m.style.display = 'none'; }
